name: metax_tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  run_tests:
    uses: ./.github/workflows/all_tests_common.yml
    with:
      platform: metax
      # Metax Environment Setup
      setup_commands: |
       
        if [ -f "/opt/conda/etc/profile.d/conda.sh" ]; then
          source /opt/conda/etc/profile.d/conda.sh
          
          conda activate flagscale-train || echo "Using default conda environment"
        fi
        
        export LD_LIBRARY_PATH=/usr/local/maca/lib:/opt/maca/lib:$LD_LIBRARY_PATH
        
        python3 --version
        which python3

  all_tests:
    needs: run_tests
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify workflow status
        run: |
          if [ "${{ needs.run_tests.result }}" != "success" ]; then
            echo "❌ Metax Tests workflow failed"
            exit 1
          fi
          echo "✅ All Metax tests passed!"