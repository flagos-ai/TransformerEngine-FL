# Reusable per-platform pipeline for TransformerEngine-FL CI:
#   all_tests_common.
# Called from ci.yml with a platform matrix so each platform runs independently.

name: Platform Pipeline

on:
  workflow_call:
    secrets:
      FLAGCICD_API_TOKEN:
        required: false
    inputs:
      platform:
        required: true
        type: string
        description: Platform identifier (must match a .github/configs/*.yml stem)
      checkout_ref:
        required: false
        type: string
        default: ''
        description: Git ref to checkout
      plan:
        required: true
        type: string
        description: Full plan JSON from planner

jobs:
  test:
    name: test / ${{ inputs.platform }}
    uses: ./.github/workflows/all_tests_common.yml
    secrets:
      FLAGCICD_API_TOKEN: ${{ secrets.FLAGCICD_API_TOKEN }}
    with:
      platform: ${{ inputs.platform }}
      checkout_ref: ${{ inputs.checkout_ref }}
      plan: ${{ inputs.plan }}
