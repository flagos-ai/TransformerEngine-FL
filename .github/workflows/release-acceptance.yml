# Release acceptance (FlagCICD stage "release"): the fixed L4 level on every
# platform for one release ref.  Required groups that the catalog marks as
# blocked fail the gate instead of passing as an absent matrix entry.
#
# Pipeline: plan -> platform-pipeline (matrix) -> complete

name: Release Acceptance

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: 'Release tag, branch or SHA to accept'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-acceptance-${{ inputs.checkout_ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Generate release plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      plan_hash: ${{ steps.plan.outputs.plan_hash }}
      platforms: ${{ steps.plan.outputs.platforms }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      test_level: ${{ steps.plan.outputs.test_level }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/flagcicd-plan
        id: plan
        with:
          stage: release

  platform-pipeline:
    name: Platform pipeline (${{ matrix.platform }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.plan.outputs.platforms) }}
    uses: ./.github/workflows/all_tests_common.yml
    secrets:
      FLAGCICD_API_TOKEN: ${{ secrets.FLAGCICD_API_TOKEN }}
    with:
      platform: ${{ matrix.platform }}
      checkout_ref: ${{ needs.plan.outputs.source_sha }}
      plan: ${{ needs.plan.outputs.plan }}

  complete:
    name: Release Acceptance Complete
    needs: [plan, platform-pipeline]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/flagcicd-gate
        with:
          plan: ${{ needs.plan.outputs.plan }}
          needs-json: ${{ toJson(needs) }}
          plan-job: plan
          pipeline-job: platform-pipeline
