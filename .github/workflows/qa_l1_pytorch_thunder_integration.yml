name: QA L1 Pytorch Thunder Integration

on:
  push:
    branches:
      - add_qa_teat251230
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  qa-l1-thunder_integration:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    container:
      image: localhost:5000/flagscale:cuda12.8.1-cudnn9.10.2-torch2.9.1-py3.10-transformerengine_fl
      ports:
        - 80:80
      options: >-
        --gpus all 
        --shm-size=500g 
        --privileged 
        --ipc=host 
        --ulimit memlock=-1 
        --ulimit stack=67108864 
        --ulimit nofile=65535:65535 
        --user root

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          ssh-strict: true
          ssh-user: git
          persist-credentials: true
          clean: true
          sparse-checkout-cone-mode: true
          fetch-tags: false
          show-progress: true
          lfs: false
          submodules: recursive
          set-safe-directory: true
      
      - name: Pre-Check Environment
        timeout-minutes: 5
        run: |
          set -euo pipefail
          echo "===== System Info ====="
          uname -a
          python3 --version || (echo "❌ python3 not found"; exit 1)
          pip3 --version || (echo "❌ pip3 not found"; exit 1)

          echo "===== GPU Info ====="
          if command -v nvidia-smi &>/dev/null; then
            nvidia-smi --query-gpu=index,name,memory.total,utilization.gpu --format=csv
          else
            echo "⚠️ GPU check skipped. nvidia-smi is not available in the current environment."
            exit 1
          fi

          nvcc --version || echo "⚠️ nvcc not found (non-fatal for python-only install)"

          echo "===== Disk Space ====="
          df -h

          echo "===== Available memory ====="
          free -h

      - name: Install dependencies and build transformer_engine
        timeout-minutes: 30
        run: |
          echo "=============== Install dependencies ==============="
          pip install optree looseversion opt_einsum lightning_utilities

          echo "=============== Clone lightning-thunder ==============="
          git clone --recurse-submodules https://github.com/Lightning-AI/lightning-thunder.git

          echo "=============== Install transformer_engine ==============="
          pip install --no-build-isolation -vvv . --no-deps
          cp -rf transformer_engine/plugins/ /usr/local/lib/python3.10/dist-packages/transformer_engine/plugins/

      - name: Verify installation
        shell: bash
        run: |
          python3 tests/pytorch/test_sanity_import.py

      - name: GPU Usage Check / Verification
        run: |
          source .github/workflows/scripts/gpu_check.sh
          wait_for_gpu

      - name: L1 Pytorch Thunder Integration
        id: L1_pytorch_thunder_integration
        env:
          XML_LOG_DIR: "/logs/pytorch/thunder"
          THUNDER_PATH: "lightning-thunder"
        run: bash ./qa/L1_pytorch_thunder_integration/test.sh

      - name: Upload Installation Logs
        if: failure() && steps.L1_pytorch_thunder_integration.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: L0_pytorch-logs-${{ github.run_id }}
          path: /logs
          retention-days: 7
          if-no-files-found: warn
        continue-on-error: true
