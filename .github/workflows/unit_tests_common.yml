        if: inputs.language == 'python' || inputs.language == 'all'
        run: |
          # Run Python unit tests
          # Example: python -m pytest tests/python/

      - name: Run C++ unit tests
        if: inputs.language == 'cpp' || inputs.language == 'all'
        run: |
          # Run C++ unit tests
          # Example: make test-cpp