name: Common Unit Tests

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      device:
        required: true
        type: string
      image:
        required: true
        type: string
      runs_on:
        required: true
        type: string
      container_volumes:
        required: true
        type: string
      container_options:
        required: true
        type: string
      ignored_tests:
        required: false
        type: string
        default: ''
      setup_commands:
        required: false
        type: string
        default: ''
      build_env:
        required: false
        type: string
        default: '{}'

jobs:
  # 1. Detect which files changed to optimize test execution
  detect_changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      qa_l0: ${{ steps.filter.outputs.qa_l0 }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        run: |
          set -euo pipefail
          BASE_REF="${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}"
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            git fetch origin ${{ github.base_ref }} --depth=1
          fi
          
          CHANGED_FILES=$(git diff --name-only $BASE_REF...HEAD 2>/dev/null || git diff --name-only $BASE_REF HEAD)

          echo "core=$(echo "$CHANGED_FILES" | grep -qE "^tests/unit_tests/|^megatron/core/|^.github/" && echo "true" || echo "false")" >> $GITHUB_OUTPUT
          echo "qa_l0=$(echo "$CHANGED_FILES" | grep -qE "^qa/L0_|^transformer_engine/|^tests/pytorch/|^.github/" && echo "true" || echo "false")" >> $GITHUB_OUTPUT

  # 2. Execute Tests inside a manually managed Docker container
  unit_test:
    needs: detect_changes
    runs-on: ${{ fromJson(inputs.runs_on) }}
    strategy:
      fail-fast: false
      matrix:
        test_group:
          # - name: pytorch_lint
          #   path: "qa/L0_pytorch_lint/test.sh"
          #   test_type: "sh"
          - name: pytorch_debug
            path: "qa/L0_pytorch_debug_unittest/test.sh"
            test_type: "sh"
          # - name: pytorch_unittest
          #   path: "qa/L0_pytorch_unittest/test.sh"
          #   test_type: "sh"
          # - name: pytorch_wheel
          #   path: "qa/L0_pytorch_wheel/test.sh"
          #   test_type: "sh"

    name: unit-${{ inputs.device }}-${{ matrix.test_group.name }}
    
    env:
      # Use unique container names for parallel matrix jobs
      CONTAINER_NAME: metax_ci_${{ github.run_id }}_${{ strategy.job-index }}
      MACA_LIBS: "/opt/maca/lib:/opt/maca/ompi/lib:/opt/maca/ucx/lib:/opt/mxdriver/lib:/usr/local/lib"

    steps:
     
      - name: Fix Workspace Permissions & Cleanup
        run: |
          echo "Using a temporary 'bulldozer' container to clean workspace..."
         
          docker run --rm \
            -v ${{ github.workspace }}:/cleanup_dir \
            busybox sh -c "rm -rf /cleanup_dir/TransformerEngine-FL"
          
          echo "Workspace cleared."

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          set-safe-directory: true
          path: TransformerEngine-FL

      - name: Create and Start Clean Container
        run: |
          echo "Launching container: ${{ env.CONTAINER_NAME }}"
          docker run -d --name ${{ env.CONTAINER_NAME }} \
            --privileged \
            --network host \
            --ipc host \
            --uts host \
            --shm-size 100gb \
            --group-add video \
            -v /nfs/metax_fs:/nfs/metax_fs \
            -v /home/muxiuser:/home/muxiuser \
            -v /opt/maca:/opt/maca \
            -v /dev:/dev \
            -v ${{ github.workspace }}/TransformerEngine-FL:/workspace/TransformerEngine-FL \
            -w /workspace/TransformerEngine-FL \
            ${{ inputs.image }} \
            tail -f /dev/null

      - name: Check if tests should run
        id: should_run
        run: |
          GROUP='${{ matrix.test_group.name }}'
          if [ "${{ contains(github.event.pull_request.labels.*.name, 'full ci') }}" == "true" ]; then 
            echo "should_run=true" >> $GITHUB_OUTPUT
          elif [[ "$GROUP" == "pytorch_"* ]]; then
            echo "should_run=${{ needs.detect_changes.outputs.qa_l0 }}" >> $GITHUB_OUTPUT
          else
            echo "should_run=${{ needs.detect_changes.outputs.core }}" >> $GITHUB_OUTPUT
          fi
          # Note: Currently forcing to true as per your previous logic
          echo "should_run=true" >> $GITHUB_OUTPUT

      - name: Setup Environment Inside Container
        if: steps.should_run.outputs.should_run == 'true'
        run: |
          docker exec -t ${{ env.CONTAINER_NAME }} /bin/bash -c "
            set -e
            echo '===== 1. Activate Conda Environment ====='
            source /opt/conda/etc/profile.d/conda.sh && conda activate base
            
            echo '===== 2. Setup Metax Toolchain & Paths ====='
            export PATH=/opt/maca/bin:\$PATH
            # Link cucc to nvcc for TransformerEngine build compatibility
            ln -sf /opt/maca/tools/cu-bridge/bin/cucc /opt/maca/tools/cu-bridge/bin/nvcc
            apt-get update -qq && apt-get install -y -qq git cmake ninja-build
            
            echo '===== 3. Build and Install TransformerEngine-FL ====='
            python3 -m pip uninstall transformer_engine -y || true
            TE_FL_SKIP_CUDA=1 NVTE_WITH_MACA=1 python3 setup.py install
            
            echo '===== 4. Verify Backend Library Loading ====='
            export LD_LIBRARY_PATH='${{ env.MACA_LIBS }}:\$LD_LIBRARY_PATH'
            python3 -c 'import transformer_engine; print(\"TransformerEngine API initialized successfully\")'
          "
          
      - name: Execute Test Group Inside Container
        if: steps.should_run.outputs.should_run == 'true'
        run: |
          # Determine command based on matrix test_type
          if [[ "${{ matrix.test_group.test_type }}" == "sh" ]]; then
            TEST_COMMAND="bash ${{ matrix.test_group.path }}"
          else
            TEST_COMMAND="pytest -v -s ${{ matrix.test_group.path }}"
          fi

          echo "Executing: $TEST_COMMAND in ${{ env.CONTAINER_NAME }}"

          docker exec -t \
            -e LD_LIBRARY_PATH='${{ env.MACA_LIBS }}' \
            -e MACA_VISIBLE_DEVICES=all \
            -e TE_PATH='/workspace/TransformerEngine-FL' \
            -e PLATFORM='metax' \
            ${{ env.CONTAINER_NAME }} /bin/bash -c "
              set -e
              source /opt/conda/etc/profile.d/conda.sh && conda activate base
              cd /workspace/TransformerEngine-FL
              
              # Parse platform-specific build environment variables
              while IFS='=' read -r key value; do
                [ -n \"\$key\" ] && export \"\$key=\$value\"
              done < <(echo '${{ inputs.build_env }}' | python3 -c \"
              import json, sys
              env = json.load(sys.stdin)
              for k, v in env.items():
                  print(f'{k}={v}')
              \")

              echo '===== Starting Test Execution ====='
              $TEST_COMMAND
            "

      - name: Debug - Keep container alive on failure
        if: failure()
        run: |
          echo "Failure detected. Container ${{ env.CONTAINER_NAME }} is kept for debugging."
          echo "Access command: docker exec -it ${{ env.CONTAINER_NAME }} bash"
          sleep 3600
        timeout-minutes: 65

      - name: Cleanup Container
        if: always()
        run: |
          docker rm -f ${{ env.CONTAINER_NAME }} || true