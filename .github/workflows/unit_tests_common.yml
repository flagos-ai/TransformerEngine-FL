name: Common Unit Tests


on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      device:
        required: true
        type: string
      image:
        required: true
        type: string
      runs_on:
        required: true
        type: string
      container_volumes:
        required: true
        type: string
      container_options:
        required: true
        type: string
      ignored_tests:
        required: false
        type: string
        default: ''
      # New input for hardware-specific initialization (e.g., conda activate)
      setup_commands:
        required: false
        type: string
        default: ''

jobs:
  # 1. Change Detection
  detect_changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      qa_l0: ${{ steps.filter.outputs.qa_l0 }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        run: |
          set -euo pipefail
          BASE_REF="${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}"
          [ "${{ github.event_name }}" == "pull_request" ] && git fetch origin ${{ github.base_ref }} --depth=1
          
          CHANGED_FILES=$(git diff --name-only $BASE_REF...HEAD 2>/dev/null || git diff --name-only $BASE_REF HEAD)

          echo "core=$(echo "$CHANGED_FILES" | grep -qE "^tests/unit_tests/|^megatron/core/|^.github/" && echo "true" || echo "false")" >> $GITHUB_OUTPUT
          echo "qa_l0=$(echo "$CHANGED_FILES" | grep -qE "^qa/L0_|^transformer_engine/|^tests/pytorch/|^.github/" && echo "true" || echo "false")" >> $GITHUB_OUTPUT
  
  # 2. Unified Test Execution
  unit_test:
    needs: detect_changes
    defaults:
      run:
        shell: bash
    runs-on: ${{ fromJson(inputs.runs_on) }}
    strategy:
      fail-fast: false
      matrix:
        test_group:
          - name: core
            path: "tests/unit_tests/test_*.py"
            test_type: "pytest"
          - name: distributed
            path: "tests/unit_tests/distributed/"
            test_type: "pytest"
          - name: pytorch_unittest
            path: "qa/L0_pytorch_unittest/test.sh"
            test_type: "sh"
          - name: pytorch_debug
            path: "qa/L0_pytorch_debug_unittest/test.sh"
            test_type: "sh"
          - name: pytorch_lint
            path: "qa/L0_pytorch_lint/test.sh"
            test_type: "sh"
          - name: pytorch_wheel
            path: "qa/L0_pytorch_wheel/test.sh"
            test_type: "sh"

    name: unit-${{ inputs.device }}-${{ matrix.test_group.name }}
    container:
      image: ${{ inputs.image }}
      volumes: ${{ fromJson(inputs.container_volumes) }}
      options: --pull never ${{ inputs.container_options }}

    steps:
      - name: Check if tests should run
        id: should_run
        run: |
          echo "should_run=true" >> $GITHUB_OUTPUT
          GROUP='${{ matrix.test_group.name }}'
          # Force run if 'full ci' label exists
          if [ "${{ contains(github.event.pull_request.labels.*.name, 'full ci') }}" == "true" ]; then 
            echo "should_run=true" >> $GITHUB_OUTPUT; exit 0
          fi

          if [[ "$GROUP" == "pytorch_"* ]]; then
            CHANGED='${{ needs.detect_changes.outputs.qa_l0 }}'
          else
            CHANGED='${{ needs.detect_changes.outputs.core }}'
          fi
          # For debugging, you can force this to true
          echo "should_run=$CHANGED" >> $GITHUB_OUTPUT

      - name: Checkout source code
        if: steps.should_run.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          set-safe-directory: true

      - name: Environment Setup
        if: steps.should_run.outputs.should_run == 'true'
        env:
          TE_FL_SKIP_CUDA: '1' 
          SKIP_CUDA_BUILD: '1'
          
          NVTE_WITH_MACA: '1'
          NVTE_WITH_CUDA: '0'
          MACA_HOME: /opt/maca
          NVCC: /opt/maca/bin/mcc
          CUDA_HOME: /opt/maca
        run: |
          export PATH=/opt/maca/bin:$PATH
          export LD_LIBRARY_PATH=/opt/maca/lib:/usr/local/maca/lib:${LD_LIBRARY_PATH:-}

          set -euo pipefail
          # 1. Execute hardware-specific setup (e.g. conda activate, export paths)

          #! setup_commands from all_tests_xxx.yml(like all_tests_metax.yml) 
          ${{ inputs.setup_commands }}

          python3 -m pip install --no-cache-dir cmake ninja --no-deps
          cmake --version

          which python3
          python3 -c "import torch; print(f'Native Torch Version: {torch.__version__}')"

          python3 -m pip config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple
          # 2. Universal dependency sync using the activated python environment
          python3 -m pip install --no-cache-dir transformers expecttest boto3==1.42.1 --no-deps || true
          python3 -m pip install -v -e . --no-deps --no-build-isolation
        # more time needed...
        timeout-minutes: 120

      - name: Execute Tests
        if: steps.should_run.outputs.should_run == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          # 1. Re-execute setup commands for the new shell session
          ${{ inputs.setup_commands }}
          
          # 2. Export Common TE Variables
          export TE_PATH=$GITHUB_WORKSPACE
          export PYTHONPATH=$GITHUB_WORKSPACE:${PYTHONPATH:-}
          export RUN_LOG=/tmp/te_logs && mkdir -p $RUN_LOG

          # 3. Dynamic Hardware Detection
          NUM_GPUS=$(python3 -c "import torch; print(torch.cuda.device_count() if torch.cuda.is_available() else 0)")
          echo "=== Platform: ${{ inputs.platform }} | Device: ${{ inputs.device }} | GPUs: $NUM_GPUS ==="

          if [ "${{ matrix.test_group.test_type }}" == "sh" ]; then
            echo "::group::Executing Legacy Shell Script"
            # Detect TE path for legacy scripts to find C++/MACA extensions
            export TE_LIB_PATH=$(python3 -c "import transformer_engine; import os; print(os.path.dirname(transformer_engine.__file__))")
            
            if [[ "${{ matrix.test_group.name }}" == *"lint"* ]]; then
               export CPP_ONLY=0
               export PYTHON_ONLY=0
            fi
            bash ${{ matrix.test_group.path }}
            echo "::endgroup::"
          else
            echo "::group::Executing Modern Pytest"
            # Extract ignored tests from configuration
            IGNORED_TESTS='${{ inputs.ignored_tests }}'
            IGNORE_OPTS=$(echo "$IGNORED_TESTS" | python3 -c "import sys, json; t = json.load(sys.stdin); print(' '.join(['--deselect=' + i for i in t])) if t else print('')")
            
            torchrun --nproc_per_node=$NUM_GPUS -m pytest -v ${{ matrix.test_group.path }} $IGNORE_OPTS -p no:randomly
            echo "::endgroup::"
          fi
        timeout-minutes: 60