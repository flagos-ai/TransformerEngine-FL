name: Common Unit Tests


on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      device:
        required: true
        type: string
      image:
        required: true
        type: string
      runs_on:
        required: true
        type: string
      container_volumes:
        required: true
        type: string
      container_options:
        required: true
        type: string
      ignored_tests:
        required: false
        type: string
        default: ''
      # New input for hardware-specific initialization (e.g., conda activate)
      setup_commands:
        required: false
        type: string
        default: ''

jobs:
  # 1. Change Detection
  detect_changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      qa_l0: ${{ steps.filter.outputs.qa_l0 }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        run: |
          set -euo pipefail
          BASE_REF="${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}"
          [ "${{ github.event_name }}" == "pull_request" ] && git fetch origin ${{ github.base_ref }} --depth=1
          
          CHANGED_FILES=$(git diff --name-only $BASE_REF...HEAD 2>/dev/null || git diff --name-only $BASE_REF HEAD)

          echo "core=$(echo "$CHANGED_FILES" | grep -qE "^tests/unit_tests/|^megatron/core/|^.github/" && echo "true" || echo "false")" >> $GITHUB_OUTPUT
          echo "qa_l0=$(echo "$CHANGED_FILES" | grep -qE "^qa/L0_|^transformer_engine/|^tests/pytorch/|^.github/" && echo "true" || echo "false")" >> $GITHUB_OUTPUT
  
  # 2. Unified Test Execution
  unit_test:
    needs: detect_changes
    defaults:
      run:
        shell: bash
    runs-on: ${{ fromJson(inputs.runs_on) }}
    strategy:
      fail-fast: false
      matrix:
        test_group:
          # - name: core
          #   path: "tests/unit_tests/test_*.py"
          #   test_type: "pytest"
          # - name: distributed
          #   path: "tests/unit_tests/distributed/"
          #   test_type: "pytest"
          # - name: pytorch_debug
          #   path: "qa/L0_pytorch_debug_unittest/test.sh"
          #   test_type: "sh"
          - name: pytorch_unittest
            path: "qa/L0_pytorch_unittest/test.sh"
            test_type: "sh"
          # - name: pytorch_lint
          #   path: "qa/L0_pytorch_lint/test.sh"
          #   test_type: "sh"
          # - name: pytorch_wheel
          #   path: "qa/L0_pytorch_wheel/test.sh"
          #   test_type: "sh"

    name: unit-${{ inputs.device }}-${{ matrix.test_group.name }}
    container:
      image: ${{ inputs.image }}
      volumes: ${{ fromJson(inputs.container_volumes) }}
      options: --pull never ${{ inputs.container_options }}

    steps:
      - name: Check if tests should run
        id: should_run
        run: |
          echo "should_run=true" >> $GITHUB_OUTPUT
          GROUP='${{ matrix.test_group.name }}'
          # Force run if 'full ci' label exists
          if [ "${{ contains(github.event.pull_request.labels.*.name, 'full ci') }}" == "true" ]; then 
            echo "should_run=true" >> $GITHUB_OUTPUT; exit 0
          fi

          if [[ "$GROUP" == "pytorch_"* ]]; then
            CHANGED='${{ needs.detect_changes.outputs.qa_l0 }}'
          else
            CHANGED='${{ needs.detect_changes.outputs.core }}'
          fi
          # For debugging, you can force this to true
          # echo "should_run=$CHANGED" >> $GITHUB_OUTPUT

          # Force Run
          echo "should_run=true" >> $GITHUB_OUTPUT

      - name: Checkout source code
        if: steps.should_run.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          set-safe-directory: true

      - name: Activate Python environment
        run: |
          source /opt/conda/etc/profile.d/conda.sh
          conda activate base
          echo "PATH=$PATH" >> $GITHUB_ENV

      - name: Environment Setup
        if: steps.should_run.outputs.should_run == 'true'
        env:
          TE_FL_SKIP_CUDA: '1' 
          SKIP_CUDA_BUILD: '1'
          NVTE_WITH_MACA: '1'
          NVTE_WITH_CUDA: '0'

          # MetaX: MACA is at /opt/maca on both host and container
          MACA_HOME: /opt/maca
          NVCC: /opt/maca/bin/mcc
          CUDA_HOME: /opt/maca
          
        run: |
          # 1. Base path and environment settings
          export PATH=/opt/maca/bin:$PATH
          export LD_LIBRARY_PATH=/opt/maca/lib:${LD_LIBRARY_PATH:-}
          set -euo pipefail

          # 2. Execute hardware-specific initialization (e.g., conda, device paths)
          ${{ inputs.setup_commands }}
          
          # 3. Install system tools (Crucial: do NOT update Python libraries here)
          apt-get update -qq && apt-get install -y -qq git cmake ninja-build
          python3 -m pip install nvdlfw-inspect --no-deps || true

          # 4. Environment Debugging: Print current versions
          echo "=== Pre-install Check ==="
          python3 --version
          python3 -c "import torch; print(f'Original Torch: {torch.__version__}')"

          # 5. Remove existing versions to prevent library conflicts
          python3 -m pip uninstall transformer_engine transformer_engine_metax -y || true

          # 6. Install the Metax Binary Backend (The foundation for MACA operators)
          WHL_PATH="/home/muxiuser/transformer_engine_metax-2.9.0-cp312-cp312-linux_x86_64.whl"
          if [ -f "$WHL_PATH" ]; then
            echo "Installing Metax CP312 base package..."
            # CRITICAL: Use --no-deps to prevent pip from overwriting Metax-optimized Torch with NVIDIA versions
            python3 -m pip install "$WHL_PATH" --no-deps --force-reinstall
          else
            echo "ERROR: $WHL_PATH not found! Verify volume mount: -v /home/muxiuser:/home/muxiuser"
            exit 1
          fi

          # # Find the actual .so file path
          # REAL_SO=$(find /opt/conda -name "transformer_engine_torch_metax*.so" | head -n 1)
          # # Create a symbolic link so that 'import transformer_engine_torch' works
          # ln -s "$REAL_SO" /opt/conda/lib/python3.12/site-packages/transformer_engine_torch.so

          # # 7. Verify the binary backend is correctly linked
          # echo "Verifying binary backend linkage..."
          # python3 -c "import transformer_engine_torch; print('Binary backend loaded successfully')"

          # 8. Install the TE-FL Plugin Layer (Python-side logic)
          echo "Installing TE-FL plugin layer..."
          export TE_FL_SKIP_CUDA=1
          cd $GITHUB_WORKSPACE
          # Using setup.py directly provides precise control over the installation process
          python3 setup.py install
          
          echo "=== Environment Setup Complete ==="

        # more time needed...
        timeout-minutes: 120

      - name: Execute Tests
        if: steps.should_run.outputs.should_run == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          ${{ inputs.setup_commands }}

          export TE_PATH=$GITHUB_WORKSPACE
          export PYTHONPATH=$GITHUB_WORKSPACE:${PYTHONPATH:-}
          export MACA_HOME=/opt/maca
          export CUDA_HOME=/opt/maca
          export PATH=/opt/maca/bin:$PATH
          export LD_LIBRARY_PATH=/opt/maca/lib:${LD_LIBRARY_PATH:-}
          export NVTE_WITH_MACA=1
          export NVTE_WITH_CUDA=0
          export TE_FL_SKIP_CUDA=1
          export SKIP_CUDA_BUILD=1

          if [[ "${{ matrix.test_group.name }}" == *"lint"* ]]; then
            export CPP_ONLY=0
            export PYTHON_ONLY=0
          elif [[ "${{ matrix.test_group.name }}" != *"debug"* ]]; then
            # Fail fast on backend/API mismatch before running the full test group.
            # Skip for debug group (does not use FP8/optimizer symbols).
            python3 -c "import sys, importlib; import transformer_engine.common as _te_common; tex = importlib.import_module('transformer_engine_torch'); required=['multi_tensor_scale','multi_tensor_compute_scale_and_scale_inv']; missing=[n for n in required if not hasattr(tex, n)]; print('[TE check] module:', tex); print('[TE check] file:', getattr(tex, '__file__', 'N/A')); print('[TE check] missing:', ', '.join(missing) if missing else 'none'); sys.exit(1 if missing else 0)"
          fi

          bash ${{ matrix.test_group.path }}
        timeout-minutes: 60

      - name: Debug - keep container alive on failure
        if: failure()
        run: |
          echo "Container sleeping for 10 minutes for debugging..."
          echo "On host, run: docker ps  then  docker exec -it <container_id> bash"
          sleep 600
        timeout-minutes: 60