name: Test Groups Common

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      checkout_ref:
        required: true
        type: string
      plan:
        required: true
        type: string
        description: 'Full plan JSON'
      matrix:
        required: true
        type: string
        description: 'Matrix JSON with {include: [{device, name, kind, ...}]}'
      max_parallel:
        required: false
        type: number
        default: 256
      image:
        required: true
        type: string
      container_pull_policy:
        required: false
        type: string
        default: 'never'
      runs_on:
        required: true
        type: string
        description: 'JSON array of runner labels'
      container_volumes:
        required: true
        type: string
        description: 'JSON array of volume mounts'
      container_options:
        required: true
        type: string
      setup_script:
        required: false
        type: string
        default: ''
      checkout_submodules:
        required: false
        type: string
        default: 'false'
      test_artifact_name:
        required: false
        type: string
        default: ''
      test_artifact_path:
        required: false
        type: string
        default: ''
      config_hash:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      coverage_required:
        required: false
        type: string
        default: 'false'
      coverage_sources:
        required: false
        type: string
        default: ''
        description: 'Comma-separated coverage sources passed to --cov'

jobs:
  test_group:
    runs-on: ${{ fromJson(inputs.runs_on) }}
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max_parallel }}
      matrix: ${{ fromJson(inputs.matrix) }}
    name: ${{ matrix.kind }}-${{ matrix.device }}-${{ matrix.name }}
    container:
      image: ${{ inputs.image }}
      volumes: ${{ fromJson(inputs.container_volumes) }}
      options: --pull ${{ inputs.container_pull_policy }} ${{ inputs.container_options }}
    # Preserve failed step outcomes/reports; only required jobs block the caller.
    continue-on-error: ${{ matrix.required != true }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - name: Prepare checkout environment
        run: |
          /usr/bin/git config --global --replace-all safe.directory '*'
          /usr/bin/git config --global --unset-all credential.helper 2>/dev/null || true
          /usr/bin/git config --system --unset-all credential.helper 2>/dev/null || true

      - name: Checkout source code
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref }}
          fetch-depth: 0
          submodules: ${{ inputs.checkout_submodules }}
          set-safe-directory: true

      - name: Download test artifact
        id: artifact
        if: inputs.test_artifact_name != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.test_artifact_name }}
          path: ${{ inputs.test_artifact_path }}

      - name: Verify artifact identity
        id: identity
        if: inputs.test_artifact_name != ''
        run: |
          python3 .github/scripts/ci/flagcicd_identity.py verify \
            --platform "${{ inputs.platform }}" \
            --source-sha "${{ inputs.source_sha }}" \
            --config-hash "${{ inputs.config_hash }}" \
            --artifact-dir "$GITHUB_WORKSPACE/${{ inputs.test_artifact_path }}"

      - name: Setup environment
        id: setup
        if: inputs.setup_script != ''
        env:
          TE_CI_ARTIFACT_DIR: ${{ inputs.test_artifact_path }}
        run: bash "$GITHUB_WORKSPACE/${{ inputs.setup_script }}"

      - name: Execute tests
        id: execute
        shell: bash
        env:
          TE_TEST_GROUP_JSON: ${{ toJson(matrix) }}
          TE_TEST_MAX_RETRIES: '2'
          COVERAGE_REQUIRED: ${{ inputs.coverage_required }}
          COVERAGE_SOURCES: ${{ inputs.coverage_sources }}
        run: |
          set -euo pipefail
          echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
          export TE_PATH="$GITHUB_WORKSPACE"

          # Set XML_LOG_DIR for junit output
          export XML_LOG_DIR="$GITHUB_WORKSPACE/logs/${{ matrix.kind }}/${{ matrix.name }}"
          mkdir -p "$XML_LOG_DIR"

          # Set TE_LIB_PATH based on group kind
          case "${{ matrix.kind }}" in
            unit)
              export TE_LIB_PATH="$(python3 -c 'import site; print(site.getsitepackages()[0])')"
              export PYTHONPATH="$TE_PATH:${PYTHONPATH:-}"
              ;;
            integration|compat)
              export TE_LIB_PATH="${TE_LIB_PATH:-$(python3 -c 'import site; print(site.getsitepackages()[0])')/transformer_engine}"
              ;;
            *)
              echo "ERROR: unsupported test group kind '${{ matrix.kind }}'" >&2
              exit 1
              ;;
          esac

          echo "TE_PATH=$TE_PATH"
          echo "TE_LIB_PATH=$TE_LIB_PATH"
          echo "XML_LOG_DIR=$XML_LOG_DIR"

          # Coverage uses the platform coverage.sources. Each group writes its
          # own data file, and --cov-append keeps every pytest call the group
          # launcher makes instead of letting the last one erase the others.
          if [ "${{ matrix.coverage }}" = "true" ]; then
            if python3 -c "import importlib.metadata as m; import coverage, pytest_cov; print('[coverage] coverage', m.version('coverage'), 'pytest-cov', m.version('pytest-cov'))"; then
              export COVERAGE_FILE="$GITHUB_WORKSPACE/.coverage.${{ matrix.name }}.${{ matrix.device }}"
              coverage_args=""
              for source in ${COVERAGE_SOURCES//,/ }; do
                coverage_args+=" --cov=$source"
              done
              if [ -z "$coverage_args" ]; then
                echo "ERROR: coverage is enabled but the platform config has no coverage.sources" >&2
                exit 1
              fi
              export PYTEST_ADDOPTS="${PYTEST_ADDOPTS:-}${coverage_args} --cov-append --cov-report="
              echo "Coverage enabled: COVERAGE_FILE=$COVERAGE_FILE PYTEST_ADDOPTS=$PYTEST_ADDOPTS"
            elif [ "$COVERAGE_REQUIRED" = "true" ]; then
              echo "Coverage dependencies are required but missing from the CI image: coverage pytest-cov" >&2
              exit 1
            else
              echo "WARNING: Coverage dependencies are missing from the CI image; collection disabled"
            fi
          fi

          # Run test group
          set +e
          python3 tests/test_utils/run_ci_test_group.py
          EXIT_CODE=$?
          set -e

          # Save exit code
          echo "$EXIT_CODE" > "$RUNNER_TEMP/test_exit_code"
          exit $EXIT_CODE

      - name: Generate group report
        if: ${{ !cancelled() }}
        shell: bash
        env:
          FLAGCICD_PLAN: ${{ inputs.plan }}
          FLAGCICD_STEPS: ${{ toJson(steps) }}
        run: |
          START_TIME="${{ steps.execute.outputs.started_at }}"
          DURATION=0
          if [ -n "$START_TIME" ]; then
            DURATION=$(($(date +%s) - START_TIME))
          fi

          python3 .github/scripts/ci/flagcicd_gate.py group-report \
            --platform "${{ inputs.platform }}" \
            --device "${{ matrix.device }}" \
            --group "${{ matrix.name }}" \
            --kind "${{ matrix.kind }}" \
            --level "${{ matrix.level }}" \
            --required "${{ matrix.required }}" \
            --exit-code-file "$RUNNER_TEMP/test_exit_code" \
            --junit-dir "$GITHUB_WORKSPACE/logs/${{ matrix.kind }}/${{ matrix.name }}" \
            --duration "$DURATION" \
            --output group-report.json

      - name: Upload coverage fragment
        if: ${{ !cancelled() && matrix.coverage == true }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: coverage-fragment-${{ inputs.platform }}-${{ matrix.device }}-${{ matrix.name }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 1

      - name: Upload test logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: test-logs-${{ inputs.platform }}-${{ matrix.device }}-${{ matrix.name }}
          path: |
            logs/
            **/*.log
            **/*.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload group report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: flagcicd-group-${{ inputs.platform }}-${{ matrix.device }}-${{ matrix.name }}
          path: group-report.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true
