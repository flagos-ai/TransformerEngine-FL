# PPU local/container QA; runner label must match the deployed PPU runner.
hardware_name: ppu
display_name: 'PPU ZW810E'
ci_image: harbor.baai.ac.cn/flagos-dev/transformer-engine-fl:v2.17.0-thead-ci
container_pull_policy: never
runner_labels:
  - flagcicd-810e
container_volumes: []
container_options: >-
  --privileged
  --ipc=host
  --shm-size=100g
  --ulimit memlock=-1
  --ulimit stack=67108864
  --user root
  -e PLATFORM=ppu
  -e TE_FL_SKIP_CUDA=1
  -e NVTE_FRAMEWORK=pytorch
  -e TE_FL_PREFER=flagos
  -e NVTE_FLASH_ATTN=0
  -e NVTE_FUSED_ATTN=0
  -e NVTE_UNFUSED_ATTN=1
  -e NVTE_TORCH_COMPILE=0
  -e TE_FL_PER_OP=generic_gemm=reference
  -e PPU_STEP_TIMEOUT=9000
device_types:
  - 810e
# Device budget per multi-device test job, not the host's total card count.
# Keep aligned with the devices exposed to the container and the test launcher.
nproc_per_node: 2
setup_script: .github/scripts/setup_ppu.sh
unit_test_matrix:
  - name: pytorch_debug
    runner: script
    path: tests/plugin/backend/ppu/run_unit_tests.sh
    args: [debug]
    timeout_minutes: 240
  - name: pytorch_unit
    runner: script
    path: tests/plugin/backend/ppu/run_unit_tests.sh
    args: [unittest]
    timeout_minutes: 240
  - name: pytorch_distributed
    runner: script
    path: tests/plugin/backend/ppu/run_unit_tests.sh
    args: [distributed]
    timeout_minutes: 240
  - name: pytorch_onnx
    runner: script
    path: tests/plugin/backend/ppu/run_unit_tests.sh
    args: [onnx]
    timeout_minutes: 240
integration_test_matrix:
  - name: pytorch_mcore_integration
    path: tests/plugin/backend/ppu/run_integration_tests.sh
coverage:
  enabled: true
  required: false
  python: python3
  sources:
    - transformer_engine
  include:
    - transformer_engine/pytorch/*
    - transformer_engine/debug/*
    - transformer_engine/plugin/*
  omit:
    - '*/setup.py'
    - '*/transformer_engine/plugin/core/_build_config.py'

# Exact paths or directory prefixes (ending in /) owned by this platform.
# Shared and unknown code paths conservatively trigger all platforms.
paths_watch:
  - .github/configs/ppu.yml
  - .github/scripts/setup_ppu.sh
  - tests/plugin/backend/ppu/

# Plugin node quarantines. Remove each target when its restore condition holds.
ignored_tests:
  # FlagTree torch.compile autotune grid compatibility; restore after compiled tracing passes.
  - tests/plugin/plugin/triton_dispatch_numerics_cases.py::test_dispatch_entry_does_not_shrink_the_compiled_graph
  # PPU backend gaps migrated from the launcher configuration.
  # A bare function/class covers all of its parameters; * inside brackets
  # matches part of the parameter ID (the old pytest -k substrings), so only
  # the failing parameter combinations are quarantined (verified in PR #15).
  - tests/pytorch/test_permutation.py
  - tests/pytorch/attention/test_attention.py
  - tests/pytorch/attention/test_kv_cache.py
  - tests/pytorch/debug/test_sanity.py::test_sanity_debug[fake_quant-False-mha_attention]
  - tests/pytorch/debug/test_sanity.py::test_sanity_debug[fake_quant-False-transformer_layer]
  - tests/pytorch/debug/test_api_features.py::test_per_tensor_scaling
  - tests/pytorch/debug/test_api_features.py::test_fake_quant
  - tests/pytorch/debug/test_api_features.py::test_statistics_collection
  - tests/pytorch/debug/test_api_features.py::test_statistics_multi_run
  - tests/pytorch/test_fused_optimizer.py::TestFusedSGD
  - tests/pytorch/test_fused_optimizer.py::TestFusedAdam::test_bf16_exp_avg_and_exp_avg_sq
  # FlagGems PPU elementwise kernels overflow 32-bit offsets for tensors over
  # 2^31 elements. Restore after the FlagOS Adam large-tensor update supports
  # this shape and this test passes on PPU.
  - tests/pytorch/test_fused_optimizer.py::TestAdamTest::test_large_tensor
  # FlagTree autotuning can repeat in-place mul_ on live Adam state, corrupting
  # the result on the first tuned call (observed on PPU). Restore after the
  # runtime preserves in-place arguments during tuning.
  - tests/plugin/backend/flagos/test_optimizer_numerical.py::test_multi_tensor_adam_matches_formula
  - tests/pytorch/test_multi_tensor.py::test_multi_tensor_compute_scale_and_scale_inv
  - tests/pytorch/test_numerics.py::test_gpt_cuda_graph[*dtype1*]
  - tests/pytorch/test_numerics.py::test_gpt_cuda_graph[*dtype2*]
  - tests/pytorch/test_numerics.py::test_layernorm_accuracy[*dtype1*]
  - tests/pytorch/test_numerics.py::test_layernorm_accuracy[*dtype2*]
  - tests/pytorch/test_cuda_graphs.py::test_make_graphed_callables_with_kwargs
  - tests/pytorch/test_cuda_graphs.py::test_make_graphed_callables[*-dtype1-mha*]
  - tests/pytorch/test_cuda_graphs.py::test_make_graphed_callables[*-dtype2-mha*]
  - tests/pytorch/test_cuda_graphs.py::test_make_graphed_callables[*-dtype1-transformer*]
  - tests/pytorch/test_cuda_graphs.py::test_make_graphed_callables[*-dtype2-transformer*]
  - tests/pytorch/test_cuda_graphs.py::test_make_graphed_callables_with_dot_product_attention[*dtype1*]
  - tests/pytorch/test_cuda_graphs.py::test_make_graphed_callables_with_dot_product_attention[*dtype2*]
  - tests/pytorch/test_fusible_ops.py::TestBasicOps::test_grouped_linear
  - tests/pytorch/test_fusible_ops.py::TestFusedOps::test_backward_add_rmsnorm
  - tests/pytorch/test_fusible_ops.py::TestSequentialModules::test_grouped_mlp
  - tests/pytorch/test_fusible_ops.py::TestBasicOps::test_basic_linear[*in_shape0*]
  - tests/pytorch/test_fusible_ops.py::TestBasicOps::test_basic_linear[*in_shape1*]
  - tests/pytorch/test_fusible_ops.py::TestBasicOps::test_basic_linear[*in_shape2*]
  - tests/pytorch/test_fusible_ops.py::TestBasicOps::test_layer_norm[*dtype1*]
  - tests/pytorch/test_fusible_ops.py::TestBasicOps::test_layer_norm[*dtype2*]
  - tests/pytorch/test_fusible_ops.py::TestBasicOps::test_rmsnorm[*-True-dtype1-*]
  - tests/pytorch/test_fusible_ops.py::TestBasicOps::test_rmsnorm[*-True-dtype2-*]
  - tests/pytorch/test_fusible_ops.py::TestBasicOps::test_activation[*-dtype1-*-glu]
  - tests/pytorch/test_fusible_ops.py::TestBasicOps::test_activation[*-dtype1-*-qgelu]
  - tests/pytorch/test_fusible_ops.py::TestBasicOps::test_activation[*-dtype1-*-qgeglu]
  - tests/pytorch/test_fusible_ops.py::TestBasicOps::test_clamped_swiglu[*dtype1*]
  - tests/pytorch/test_fusible_ops.py::TestBasicOps::test_dropout[dtype1-shape2-*-True-0.5]
  - tests/pytorch/test_fusible_ops.py::TestBasicOps::test_dropout[dtype2-shape2-*-True-0.5]
  - tests/pytorch/test_fusible_ops.py::TestFusedOps::test_forward_linear_bias_activation[*dtype1*in_shape0*]
  - tests/pytorch/test_fusible_ops.py::TestFusedOps::test_forward_linear_bias_activation[*dtype1*in_shape2*]
  - tests/pytorch/test_fusible_ops.py::TestFusedOps::test_forward_linear_bias_activation[*dtype2*in_shape0*]
  - tests/pytorch/test_fusible_ops.py::TestFusedOps::test_forward_linear_bias_activation[*dtype2*in_shape2*]
  - tests/pytorch/test_fusible_ops.py::TestFusedOps::test_forward_linear_bias_add[*-dtype1-True]
  - tests/pytorch/test_fusible_ops.py::TestFusedOps::test_forward_linear_scale_add[*dtype1*2.5*]
  - tests/pytorch/test_fusible_ops.py::TestFusedOps::test_forward_linear_scale_add[*dtype1*3.5*]
  - tests/pytorch/test_fusible_ops.py::TestCheckpointing::test_linear[*True*]
  - tests/pytorch/test_cpu_offloading.py::TestTELayers::test_memory[*multihead_attention*]
  - tests/pytorch/test_cpu_offloading.py::TestTELayers::test_memory[*transformer_layer*]
  - tests/pytorch/test_cpu_offloading.py::TestTELayers::test_numerics[*transformer_layer*]
  - tests/pytorch/test_cpu_offloading.py::TestTELayers::test_numerics[UnfusedAttention-*True-multihead_attention*]
  - tests/pytorch/test_cpu_offloading_v1.py::test_cpu_offload[*multihead_attention*]
  - tests/pytorch/test_cpu_offloading_v1.py::test_cpu_offload[*transformer_layer*]
  # PPU backend gaps of the unit job only (the debug job passes them under
  # nvinspect; migrated from the launcher configuration, verified in PR #15).
  - jobs: [pytorch_unit]
    tests:
      - tests/pytorch/test_sanity.py::test_sanity_grouped_linear[*-1-dtype*]
      - tests/pytorch/test_sanity.py::test_sanity_grouped_linear[*-2-dtype*]
      - tests/pytorch/test_numerics.py::test_transformer_layer_hidden_states_format[*126m-2-dtype*]

# Current QA coverage gap, recorded in the plan instead of claimed as passing.
ignored_test_groups:
  quantization: Current 810e CI skips every selected FP8, MXFP8 and NVFP4 target; no passing quantization evidence is available.
