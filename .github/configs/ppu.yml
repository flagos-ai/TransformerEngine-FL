# PPU local/container QA; runner label must match the deployed PPU runner.
hardware_name: ppu
display_name: 'PPU ZW810E'
ci_image: harbor.baai.ac.cn/flagos-dev/transformer-engine-fl:v2.17.0-thead-ci
container_pull_policy: never
runner_labels:
  - flagcicd-810e
container_volumes: []
container_options: >-
  --privileged
  --ipc=host
  --shm-size=100g
  --ulimit memlock=-1
  --ulimit stack=67108864
  --user root
  -e PLATFORM=ppu
  -e TE_FL_SKIP_CUDA=1
  -e NVTE_FRAMEWORK=pytorch
  -e TE_FL_PREFER=flagos
  -e NVTE_FLASH_ATTN=0
  -e NVTE_FUSED_ATTN=0
  -e NVTE_UNFUSED_ATTN=1
  -e NVTE_TORCH_COMPILE=0
  -e TE_FL_PER_OP=generic_gemm=reference
  -e PPU_STEP_TIMEOUT=9000
device_types:
  - 810e
# Device budget per multi-device test job, not the host's total card count.
# Keep aligned with the devices exposed to the container and the test launcher.
nproc_per_node: 2
setup_script: .github/scripts/setup_ppu.sh
unit_test_matrix:
  - name: pytorch_debug
    runner: script
    path: tests/plugin/backend/ppu/run_unit_tests.sh
    args: [debug]
    timeout_minutes: 240
  - name: pytorch_unit
    runner: script
    path: tests/plugin/backend/ppu/run_unit_tests.sh
    args: [unittest]
    timeout_minutes: 240
  - name: pytorch_distributed
    runner: script
    path: tests/plugin/backend/ppu/run_unit_tests.sh
    args: [distributed]
    timeout_minutes: 240
  - name: pytorch_onnx
    runner: script
    path: tests/plugin/backend/ppu/run_unit_tests.sh
    args: [onnx]
    timeout_minutes: 240
integration_test_matrix:
  - name: pytorch_mcore_integration
    path: tests/plugin/backend/ppu/run_integration_tests.sh
coverage:
  enabled: true
  required: false
  python: python3
  sources:
    - transformer_engine
  include:
    - transformer_engine/pytorch/*
    - transformer_engine/debug/*
    - transformer_engine/plugin/*
  omit:
    - '*/setup.py'
    - '*/transformer_engine/plugin/core/_build_config.py'

# Exact paths or directory prefixes (ending in /) owned by this platform.
# Shared and unknown code paths conservatively trigger all platforms.
paths_watch:
  - .github/configs/ppu.yml
  - .github/scripts/setup_ppu.sh
  - tests/plugin/backend/ppu/

# Current QA coverage gap, recorded in the plan instead of claimed as passing.
ignored_test_groups:
  quantization: Current 810e CI skips every selected FP8, MXFP8 and NVFP4 target; no passing quantization evidence is available.

# These tests will be skipped when running pytest (file or file::node).
# Only defects owned outside this repository belong here; give the reason,
# owner and restore condition in a comment above each group.
ignored_tests:
  # FlagGems/FlagTree: in-place ops repeat on first-call tuning
  # (flag_gems.mul_(ones, 0.9) gives 0.9**N in a fresh process), so whichever
  # Adam case runs first fails. Restore when that repro is exact.
  - tests/plugin/backend/flagos/test_optimizer_numerical.py
  # FlagTree/FlagTune: torch.compile's generated grid returns None because FlagTree
  # launches zero_pad_kernel with BLOCK_N=32, a config TE never declares.
  # Restore when compiled tracing passes.
  - tests/plugin/plugin/triton_dispatch_numerics_cases.py::test_dispatch_entry_does_not_shrink_the_compiled_graph
