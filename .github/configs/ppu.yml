# PPU local/container QA; runner label must match the deployed PPU runner.
hardware_name: ppu
display_name: 'PPU ZW810E'
ci_image: harbor.baai.ac.cn/flagos-dev/transformer-engine-fl:v2.17.0-thead-ci
container_pull_policy: never
runner_labels:
  - flagcicd-810e
container_volumes: []
container_options: >-
  --privileged
  --ipc=host
  --shm-size=100g
  --ulimit memlock=-1
  --ulimit stack=67108864
  --user root
  -e PLATFORM=ppu
  -e TE_FL_SKIP_CUDA=1
  -e NVTE_FRAMEWORK=pytorch
  -e TE_FL_PREFER=flagos
  -e NVTE_FLASH_ATTN=0
  -e NVTE_FUSED_ATTN=0
  -e NVTE_UNFUSED_ATTN=1
  -e NVTE_TORCH_COMPILE=0
  -e TE_FL_PER_OP=generic_gemm=reference
  -e PPU_STEP_TIMEOUT=9000
device_types:
  - 810e
# Device budget per multi-device test job, not the host's total card count.
# Keep aligned with the devices exposed to the container and the test launcher.
nproc_per_node: 2
setup_script: .github/scripts/setup_ppu.sh
unit_test_matrix:
  - name: pytorch_debug
    runner: script
    path: tests/plugin/backend/ppu/run_unit_tests.sh
    args: [debug]
    timeout_minutes: 240
  - name: pytorch_unit
    runner: script
    path: tests/plugin/backend/ppu/run_unit_tests.sh
    args: [unittest]
    timeout_minutes: 240
  - name: pytorch_distributed
    runner: script
    path: tests/plugin/backend/ppu/run_unit_tests.sh
    args: [distributed]
    timeout_minutes: 240
  - name: pytorch_onnx
    runner: script
    path: tests/plugin/backend/ppu/run_unit_tests.sh
    args: [onnx]
    timeout_minutes: 240
integration_test_matrix:
  - name: pytorch_mcore_integration
    path: tests/plugin/backend/ppu/run_integration_tests.sh
coverage:
  enabled: true
  required: false
  python: python3
  sources:
    - transformer_engine
  include:
    - transformer_engine/pytorch/*
    - transformer_engine/debug/*
    - transformer_engine/plugin/*
  omit:
    - '*/setup.py'
    - '*/transformer_engine/plugin/core/_build_config.py'

# Exact paths or directory prefixes (ending in /) owned by this platform.
# Shared and unknown code paths conservatively trigger all platforms.
paths_watch:
  - .github/configs/ppu.yml
  - .github/scripts/setup_ppu.sh
  - tests/plugin/backend/ppu/

# Plugin node quarantines. Remove each target when its restore condition holds.
ignored_tests:
  # FlagTree torch.compile autotune grid compatibility; restore after compiled tracing passes.
  - tests/plugin/plugin/triton_dispatch_numerics_cases.py::test_dispatch_entry_does_not_shrink_the_compiled_graph
  # Repeated Adam numerical mismatch; restore after fresh-process numerics pass.
  - tests/plugin/backend/flagos/test_optimizer_numerical.py::test_multi_tensor_adam_matches_formula[False-0.0-0-0]
  # PPU backend gaps migrated from the launcher configuration.
  - tests/pytorch/test_permutation.py
  - tests/pytorch/attention/test_attention.py
  - tests/pytorch/attention/test_kv_cache.py
  - tests/pytorch/debug/test_sanity.py::test_sanity_debug[fake_quant-False-mha_attention]
  - tests/pytorch/debug/test_sanity.py::test_sanity_debug[fake_quant-False-transformer_layer]
  - tests/pytorch/debug/test_api_features.py::test_per_tensor_scaling
  - tests/pytorch/debug/test_api_features.py::test_fake_quant
  - tests/pytorch/debug/test_api_features.py::test_statistics_collection
  - tests/pytorch/debug/test_api_features.py::test_statistics_multi_run
  - tests/pytorch/test_sanity.py::test_sanity_grouped_linear
  - tests/pytorch/test_numerics.py::test_gpt_cuda_graph
  - tests/pytorch/test_numerics.py::test_layernorm_accuracy
  - tests/pytorch/test_numerics.py::test_transformer_layer_hidden_states_format
  - tests/pytorch/test_cuda_graphs.py::test_make_graphed_callables_with_kwargs
  - tests/pytorch/test_cuda_graphs.py::test_make_graphed_callables
  - tests/pytorch/test_cuda_graphs.py::test_make_graphed_callables_with_dot_product_attention
  - tests/pytorch/test_fused_optimizer.py::TestFusedSGD
  - tests/pytorch/test_fused_optimizer.py::TestFusedAdam::test_bf16_exp_avg_and_exp_avg_sq
  - tests/pytorch/test_multi_tensor.py::test_multi_tensor_compute_scale_and_scale_inv
  - tests/pytorch/test_fusible_ops.py::TestBasicOps::test_grouped_linear
  - tests/pytorch/test_fusible_ops.py::TestFusedOps::test_backward_add_rmsnorm
  - tests/pytorch/test_fusible_ops.py::TestSequentialModules::test_grouped_mlp
  - tests/pytorch/test_fusible_ops.py::TestBasicOps::test_basic_linear
  - tests/pytorch/test_fusible_ops.py::TestBasicOps::test_layer_norm
  - tests/pytorch/test_fusible_ops.py::TestBasicOps::test_rmsnorm
  - tests/pytorch/test_fusible_ops.py::TestBasicOps::test_activation
  - tests/pytorch/test_fusible_ops.py::TestBasicOps::test_clamped_swiglu
  - tests/pytorch/test_fusible_ops.py::TestBasicOps::test_dropout
  - tests/pytorch/test_fusible_ops.py::TestFusedOps::test_forward_linear_bias_activation
  - tests/pytorch/test_fusible_ops.py::TestFusedOps::test_forward_linear_bias_add
  - tests/pytorch/test_fusible_ops.py::TestFusedOps::test_forward_linear_scale_add
  - tests/pytorch/test_fusible_ops.py::TestCheckpointing::test_linear
  - tests/pytorch/test_cpu_offloading.py::TestTELayers::test_memory
