# CUDA Hardware Configuration for TransformerEngine-FL
# Refactored for A100 Nodes
# This file defines environment variables, volumes, and test filters for TE tests.

hardware_name: cuda
display_name: 'NVIDIA CUDA (A100)'
checkout_submodules: recursive

# CI image for online env
ci_image: harbor.baai.ac.cn/flagscale/cuda12.8.1-torch2.7.1-python3.10-te2.9:20260209

# Runner labels for the current online A100 environment
runner_labels:
  - nv-8g-cicd-te

# Container volumes
container_volumes:
  - /home/flagscale_cicd/flask/static:/workspace/report

# Container options
container_options: >-
  --privileged 
  --gpus all 
  --shm-size=500g 
  --ipc=host 
  --ulimit memlock=-1 
  --ulimit stack=67108864 
  --user root
  -e NVTE_CUDA_ARCHS=80
  -e NVTE_WITH_NCCL_EP=0

# Platform-specific environment setup script
setup_script: .github/scripts/setup_cuda.sh

# Build the PR wheel once without exposing a GPU, then reuse it in every test
# matrix job. The build still runs in the CUDA CI image on the self-hosted
# runner because that image contains the matching compiler and Python ABI.
test_artifact:
  enabled: true
  build_script: .github/scripts/build_cuda_test_wheel.sh
  path: ci-artifacts/cuda-wheel
  runner_labels:
    - nv-8g-cicd-te
  container_options: >-
    --shm-size=16g
    --user root
    -e NVTE_CUDA_ARCHS=80
    -e NVTE_WITH_NCCL_EP=0
    -e MAX_JOBS=48

# Device types to run tests on
device_types:
  - a100

coverage:
  enabled: true
  required: false
  python: /opt/miniconda3/envs/flagscale-train/bin/python3
  sources:
    - transformer_engine
  include:
    - transformer_engine/pytorch/*
    - transformer_engine/debug/*
    - transformer_engine/plugin/*
  omit:
    - '*/setup.py'
    - '*/transformer_engine/plugin/core/_build_config.py'

# Device budget per multi-device test job, not the host's total card count.
# Keep aligned with the devices exposed to the container and the test launcher.
nproc_per_node: 4

unit_test_matrix:
  - name: pytorch_debug
    runner: script
    path: tests/plugin/backend/cuda/run_unit_tests.sh
    args: [debug]
    timeout_minutes: 240
  - name: pytorch_unit
    runner: script
    path: tests/plugin/backend/cuda/run_unit_tests.sh
    args: [unittest]
    timeout_minutes: 240
  - name: pytorch_distributed
    runner: script
    path: tests/plugin/backend/cuda/run_unit_tests.sh
    args: [distributed]
    timeout_minutes: 240
  - name: pytorch_onnx
    runner: script
    path: tests/plugin/backend/cuda/run_unit_tests.sh
    args: [onnx]
    timeout_minutes: 240

integration_test_matrix:
  - name: pytorch_mcore_integration
    path: tests/plugin/backend/cuda/run_integration_tests.sh

# L3 compatibility groups. "blocked" is a declared hardware reason: the planner
# reports the group as blocked instead of running or silently skipping it.
# Remove "blocked" once a Hopper (sm90+) runner is registered.
compat_test_matrix:
  - name: fa_versions
    runner: script
    path: tests/plugin/backend/cuda/run_fa_versions_tests.sh
    blocked: requires sm90+ (Hopper or newer); online CUDA runners are A100 (sm80)

# Test matrix configuration
test_matrix:
  l0_pytorch:
    path: 'qa/L0_pytorch_unittest/test.sh'
    ignored_tests:
      - test_sanity_layernorm_mlp
      - test_sanity_gpt
      - test_sanity_bert
      - test_sanity_T5
      - test_sanity_amp_and_nvfuser
      - test_sanity_drop_path
      - test_layernorm_mlp_accuracy
      - test_grouped_linear_accuracy
      - test_gpt_accuracy
      - test_basic_linear
      - test_layer_norm

# Exact paths or directory prefixes (ending in /) owned by this platform.
# Shared and unknown code paths conservatively trigger all platforms.
paths_watch:
  - .github/configs/cuda.yml
  - .github/scripts/setup_cuda.sh
  - tests/plugin/backend/cuda/
  - transformer_engine/plugin/core/backends/vendor/cuda/
  - .github/scripts/build_cuda_test_wheel.sh

# This configuration provisions A100 (sm80) only. Revisit when adding FP8-capable devices.
unsupported_test_groups:
  quantization: A100 has no FP8 execution support; the current FP8, MXFP8 and NVFP4 targets all skip and cannot provide quantization evidence.
