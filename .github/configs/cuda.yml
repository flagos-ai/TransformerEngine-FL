# CUDA Hardware Configuration for TransformerEngine-FL
# Refactored for A100 Nodes
# This file defines environment variables, volumes, and test filters for TE tests.

hardware_name: cuda
display_name: 'NVIDIA CUDA (A100)'
checkout_submodules: recursive

# CI image for online env
ci_image: harbor.baai.ac.cn/flagscale/cuda12.8.1-torch2.7.1-python3.10-te2.9:20260209

# Runner labels for the current online A100 environment
runner_labels:
  - nv-8g-cicd-te

# Container volumes
container_volumes:
  - /home/flagscale_cicd/flask/static:/workspace/report

# Container options
container_options: >-
  --privileged 
  --gpus all 
  --shm-size=500g 
  --ipc=host 
  --ulimit memlock=-1 
  --ulimit stack=67108864 
  --user root

# Platform-specific environment setup script
setup_script: .github/scripts/setup_cuda.sh
unit_test_timeout_minutes: 240

# Build the PR wheel once without exposing a GPU, then reuse it in every test
# matrix job. The build still runs in the CUDA CI image on the self-hosted
# runner because that image contains the matching compiler and Python ABI.
test_artifact:
  enabled: true
  build_script: .github/scripts/build_cuda_test_wheel.sh
  path: ci-artifacts/cuda-wheel
  runner_labels:
    - nv-8g-cicd-te
  container_options: >-
    --shm-size=16g
    --user root

# Device types to run tests on
device_types:
  - a100

coverage:
  enabled: true
  required: false
  python: /opt/miniconda3/envs/flagscale-train/bin/python3
  sources:
    - transformer_engine
  include:
    - transformer_engine/pytorch/*
    - transformer_engine/debug/*
    - transformer_engine/plugin/*
  omit:
    - '*/setup.py'
    - '*/transformer_engine/plugin/core/_build_config.py'

unit_test_matrix:
  - name: pytorch_unittest
    runner: script
    path: tests/plugin/backend/cuda/run_unit_tests.sh

integration_test_matrix:
  - name: pytorch_mcore_integration
    path: qa/L1_pytorch_mcore_integration/test.sh

# Test matrix configuration
test_matrix:
  l0_pytorch:
    path: 'qa/L0_pytorch_unittest/test.sh'
    ignored_tests:
      - test_sanity_layernorm_mlp
      - test_sanity_gpt
      - test_sanity_bert
      - test_sanity_T5
      - test_sanity_amp_and_nvfuser
      - test_sanity_drop_path
      - test_layernorm_mlp_accuracy
      - test_grouped_linear_accuracy
      - test_gpt_accuracy
      - test_basic_linear
      - test_layer_norm
