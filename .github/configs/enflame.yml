  # migration patch expose the same fused-SGD ABI.
  - tests/pytorch/test_fused_optimizer.py::TestFusedSGD
  - tests/pytorch/test_hf_integration.py::test_save_and_load_hf_model
  - tests/pytorch/test_jit.py
  # Enflame vendor extension ABI mismatch: multi_tensor_compute_scale_and_scale_inv
