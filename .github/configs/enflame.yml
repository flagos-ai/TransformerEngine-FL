# Enflame / GCU configuration for TransformerEngine-FL.
# Keep chip-specific setup out of common workflows.

hardware_name: enflame
display_name: 'Enflame GCU'
checkout_submodules: 'false'

# v2.17.0-enflame-ci-gems5.0.2-20261112; verified on two GCU devices.
ci_image: harbor.baai.ac.cn/flagos-dev/transformer-engine-fl:v2.17.0-enflame-ci-gems5.0.2-20261112

runner_labels:
  - sy-8g-cicd-te

container_volumes: []

container_options: >-
  --privileged
  --ipc=host
  --shm-size=100g
  --ulimit memlock=-1
  --ulimit stack=67108864
  --user root
  --device=/dev/gcuctl
  --device=/dev/gcu0
  --device=/dev/gcu1
  --device=/dev/gcu2
  --device=/dev/gcu3
  --device=/dev/gcu4
  --device=/dev/gcu5
  --device=/dev/gcu6
  --device=/dev/gcu7

setup_script: .github/scripts/setup_enflame.sh

device_types:
  - S60

coverage:
  enabled: true
  required: false
  python: python3
  sources:
    - transformer_engine
  include:
    - transformer_engine/pytorch/*
    - transformer_engine/debug/*
    - transformer_engine/plugin/*
  omit:
    - '*/setup.py'
    - '*/transformer_engine/plugin/core/_build_config.py'

# Device budget per multi-device test job, not the host's total card count.
# Keep aligned with the devices exposed to the container and the test launcher.
nproc_per_node: 2

unit_test_matrix:
  - name: pytorch_debug
    runner: script
    path: tests/plugin/backend/enflame/run_unit_tests.sh
    args: [debug]
  - name: pytorch_unit
    runner: script
    path: tests/plugin/backend/enflame/run_unit_tests.sh
    args: [unittest]
    timeout_minutes: 360
  - name: pytorch_distributed
    runner: script
    path: tests/plugin/backend/enflame/run_unit_tests.sh
    args: [distributed]
  - name: pytorch_onnx
    runner: script
    path: tests/plugin/backend/enflame/run_unit_tests.sh
    args: [onnx]

integration_test_matrix:
  - name: pytorch_mcore_integration
    path: tests/plugin/backend/enflame/run_integration_tests.sh

# Exact paths or directory prefixes (ending in /) owned by this platform.
# Shared and unknown code paths conservatively trigger all platforms.
paths_watch:
  - .github/configs/enflame.yml
  - .github/scripts/setup_enflame.sh
  - tests/plugin/backend/enflame/
  - transformer_engine/plugin/core/backends/vendor/enflame/

# Missing test-group coverage is explicit; these entries do not claim hardware incapability.
ignored_test_groups:
  quantization: Enflame unit QA does not run recipe, quantized-tensor, FP8 or NVFP4 targets.

# These tests will be skipped when running pytest (file or file::node).
# Only defects owned outside this repository belong here; give the reason,
# owner and restore condition in a comment above each group.
ignored_tests:
  # FlagTree Enflame backend (flagtree 0.7.0+enflame3.6): tt.atomic_rmw cannot be
  # legalized, so kernels using tl.atomic_add fail to compile (cross entropy),
  # hang while compiling (grouped dbias) or crash (mHC). Restore when atomics compile.
  - tests/plugin/plugin/triton_dispatch_numerics_cases.py::test_cross_entropy_forward_and_backward_match_native_exactly
  - tests/plugin/plugin/triton_dispatch_numerics_cases.py::test_grouped_dbias_functions_match_native_exactly
  - tests/plugin/plugin/triton_dispatch_numerics_cases.py::test_mhc_apis_match_native_exactly
  - jobs: [pytorch_unit]
    tests:
      # PR #211 on S60: torch_gcu AMP returns the wrong output dtype.
      # Restore after these parameter combinations pass on the GCU runtime.
      - 'tests/pytorch/test_sanity.py::test_sanity_normalization_amp[*-False-False-*-dtype1]'
      - 'tests/pytorch/test_sanity.py::test_sanity_normalization_amp[*-False-True-*-dtype1]'
      - 'tests/pytorch/test_sanity.py::test_sanity_normalization_amp[*-True-False-*-dtype1]'
      # S60 Linear backward returns a 64-element gradient where 256 are expected.
      # Restore once backward returns the expected shape for zero-token inputs.
      - 'tests/pytorch/test_sanity.py::test_sanity_linear_with_zero_tokens[True-True-None-None-small-0-dtype*]'
      # 2026-11-25: the weird model returns a 69-element bias gradient instead
      # of the expected 276 elements for the zero-token case.
      - 'tests/pytorch/test_sanity.py::test_sanity_linear_with_zero_tokens[True-True-None-None-weird-0-dtype0]'
      # 2026-11-26: the same invalid bias-gradient shape affects the remaining
      # weird-model and small-model zero-token parameter combinations.
      - 'tests/pytorch/test_sanity.py::test_sanity_linear_with_zero_tokens[True-True-None-None-weird-0-dtype1]'
      - 'tests/pytorch/test_sanity.py::test_sanity_linear_with_zero_tokens[True-True-None-None-weird-1-dtype*]'
      - 'tests/pytorch/test_sanity.py::test_sanity_linear_with_zero_tokens[True-True-None-None-weird-2-dtype*]'
      - 'tests/pytorch/test_sanity.py::test_sanity_linear_with_zero_tokens[True-False-None-None-small-1-dtype*]'
      # S60 returned undersized bias gradients for these additional cases.
      # Restore when the GCU backward path returns the expected bias shape.
      - 'tests/pytorch/test_sanity.py::test_sanity_linear_with_zero_tokens[True-False-None-None-small-0-dtype0]'
      - 'tests/pytorch/test_sanity.py::test_sanity_linear_with_zero_tokens[True-False-None-None-small-0-dtype1]'
      - 'tests/pytorch/test_sanity.py::test_sanity_linear_with_zero_tokens[True-False-None-None-small-2-dtype0]'
      - 'tests/pytorch/test_sanity.py::test_sanity_linear_with_zero_tokens[True-False-None-None-weird-0-dtype0]'
      - 'tests/pytorch/test_sanity.py::test_sanity_linear_with_zero_tokens[True-False-None-None-weird-0-dtype1]'
      - 'tests/pytorch/test_sanity.py::test_sanity_linear_with_zero_tokens[True-False-None-None-weird-1-dtype0]'
      - 'tests/pytorch/test_sanity.py::test_sanity_linear_with_zero_tokens[True-False-None-None-weird-1-dtype1]'
      - 'tests/pytorch/test_sanity.py::test_sanity_linear_with_zero_tokens[True-False-None-None-weird-2-dtype0]'
      # Enflame vendor grouped GEMM rejects the TE extension argument signature.
      # Restore after the vendor binding and these parameter combinations pass.
      - 'tests/pytorch/test_sanity.py::test_sanity_grouped_linear[4-*-False-True-*-None-None-*-1-dtype*]'
      - 'tests/pytorch/test_sanity.py::test_sanity_grouped_linear[4-*-False-True-*-None-None-*-2-dtype*]'
      # Torch Inductor raises KeyError: 'gcu'. Restore after GCU lowering works.
      - 'tests/pytorch/test_sanity.py::test_sanity_layernorm_mlp[*-*-*-gelu-False-*-False-*-None-dtype*]'
      - 'tests/pytorch/test_sanity.py::test_sanity_layernorm_mlp[*-*-*-gelu-False-*-True-*-None-dtype*]'
      - 'tests/pytorch/test_sanity.py::test_sanity_layernorm_mlp[*-*-*-gelu-True-*-False-*-None-dtype*]'
      - 'tests/pytorch/test_sanity.py::test_inference_mode[None-LayerNormMLP]'
      # The loaded Enflame attention forward rejects bottom_right_diagonal.
      # Restore after the S60 attention adapter accepts the argument and passes.
      - tests/pytorch/test_sanity.py::test_sanity_gpt
      - tests/pytorch/test_sanity.py::test_sanity_gpt_126m
      - tests/pytorch/test_sanity.py::test_sanity_bert
      - tests/pytorch/test_sanity.py::test_sanity_T5
      - tests/pytorch/test_sanity.py::test_sanity_amp_and_nvfuser
      - tests/pytorch/test_sanity.py::test_sanity_drop_path
      - tests/pytorch/test_sanity.py::test_sanity_fused_qkv_params
      - tests/pytorch/test_sanity.py::test_sanity_gradient_accumulation_fusion
      # torch_gcu SDPA backward aborts with TOPSATEN_STATUS_NOT_SUPPORT.
      # Restore after the reference attention backward passes on S60.
      - 'tests/pytorch/test_numerics.py::test_gpt_accuracy[True-small-1-dtype0]'
      # 2026-11-25: SDPA backward also aborts with TOPSATEN_STATUS_RUNTIME_ERROR
      # for dtype1; restore after both GCU dtype paths pass.
      - 'tests/pytorch/test_numerics.py::test_gpt_accuracy[True-small-1-dtype1]'
      # 2026-11-26: the same unsupported SDP backward path aborts for the
      # small model's sequence-length variant 2.
      - 'tests/pytorch/test_numerics.py::test_gpt_accuracy[True-small-2-dtype0]'
      # Variant 2 also aborts in torch_gcu SDPA backward for dtype1.
      - 'tests/pytorch/test_numerics.py::test_gpt_accuracy[True-small-2-dtype1]'
      # topsStreamSynchronize aborts during graph capture. Restore after the
      # transformer path can be captured on S60 without synchronizing the stream.
      - 'tests/pytorch/test_cuda_graphs.py::test_make_graphed_callables[None-None-False-dtype0-transformer]'
      # GCU stream synchronization is unsupported during CUDA graph capture.
      # Restore when this checkpointed layernorm_mlp graph test passes.
      - 'tests/pytorch/test_cuda_graphs.py::test_make_graphed_callables[None-None-False-dtype0-layernorm_mlp_checkpoint]'
      - 'tests/pytorch/test_cuda_graphs.py::test_make_graphed_callables[None-None-False-dtype0-mha]'
      # 2026-11-26: linear_op failed in graph capture and the dtype1 transformer
      # case aborted with topsErrorStreamCaptureUnsupported.
      - 'tests/pytorch/test_cuda_graphs.py::test_make_graphed_callables[None-None-False-dtype0-linear_op]'
      - 'tests/pytorch/test_cuda_graphs.py::test_make_graphed_callables[None-None-False-dtype1-transformer]'
      # For dtype1, checkpointed layernorm_mlp fails and MHA aborts on stream
      # synchronization during capture. Restore when both pass on S60.
      - 'tests/pytorch/test_cuda_graphs.py::test_make_graphed_callables[None-None-False-dtype1-layernorm_mlp_checkpoint]'
      - 'tests/pytorch/test_cuda_graphs.py::test_make_graphed_callables[None-None-False-dtype1-mha]'
      # Reproduced on two S60s at 82edcc51 in v2.17.0-enflame-ci-gems5.0.2-20261112.
      # Vendor fused_score_for_moe_aux_loss_fwd reports GCU400-only support and
      # aborts in pybind11 (exit 134). Both families call that forward op.
      # Owner: Enflame vendor TE. Restore when the op runs on S60 and both pass.
      - tests/pytorch/test_fused_router.py::test_fused_scores_for_aux_loss
      - tests/pytorch/test_fused_router.py::test_score_for_aux_loss_bitmap_vs_bytemap
      # S60 retest at c9c1c5a2: fused_moe_aux_loss dispatches a GCU400 kernel,
      # raises topsErrorInvalidDeviceFunction (98), then aborts pytest.
      # Restore when the vendor dispatch selects an S60 kernel and this test passes.
      - tests/pytorch/test_fused_router.py::test_fused_moe_aux_loss
      # Vendor TopK returned values outside tolerance (6.2% mismatched, max
      # absolute error 0.15). The v2.17 ABI warning was also present.
      # Owner: Enflame TE adapter/vendor. Restore after this case passes by default.
      - 'tests/pytorch/test_fused_router.py::test_topk_softmax[1.2-4-False-8-128-2048-dtype0]'
      # FlagTree failed to legalize tt.atomic_rmw in mHC projection and segfaulted
      # (exit 139). Projection and combined both run that same forward kernel.
      # Owner: FlagTree Enflame. Restore once the kernel compiles and both pass.
      - tests/pytorch/test_mhc.py::test_mhc_projection
      - tests/pytorch/test_mhc.py::test_mhc_combined
      # S60 retest at c9c1c5a2: mHC scale failed to legalize tt.atomic_rmw.
      # Restore when FlagTree compiles the scale kernel and the cases pass.
      - tests/pytorch/test_mhc.py::test_mhc_scale
      # Aggregate and expand/combine exceed the S60 grid.y limit of 255.
      # Restore once their launch grids fit the limit and the cases pass.
      - tests/pytorch/test_mhc.py::test_mhc_aggregate
      - tests/pytorch/test_mhc.py::test_mhc_expand_combine
  # FlagTree Enflame backend: unpermute_with_mask_map_bwd_with_merging_probs aborts
  # after the forward passes. Restore when the backward kernel runs.
  - tests/plugin/plugin/triton_dispatch_numerics_cases.py::test_real_permutation_forward_backward_matches_pytorch
  # FlagGems 5.0.2 Enflame backend (flag_gems/runtime/backend/_enflame/gcu300) in
  # v2.17.0-enflame-ci-gems5.0.2-20261112: these lifecycle tests drive FlagOS impls with
  # CPU tensors, which its mm rejects ("Expected a gcu device, but got: cpu") or the
  # FlagTree GCU launcher cannot address ("cannot be accessed from Kurama"), and its
  # mm/addmm shape checks reject generic_gemm_fl's 3-D cases ("incompatible dimensions").
  # Same seven selectors as Iluvatar's baseline; all passed with flag_gems 5.4.0 on
  # v2.17.0-enflame-ci. Restore when the Enflame FlagGems ops accept these inputs.
  - tests/plugin/backend/flagos/test_gemm.py::test_generic_gemm_lifecycle_matrix
  - tests/plugin/backend/flagos/test_gemm.py::test_grouped_gemm_standard_lifecycle
  - tests/plugin/backend/flagos/test_multi_tensor.py::test_l2_norm_non_finite_tracking
  - tests/plugin/backend/flagos/test_multi_tensor.py::test_scale_standard_lifecycle
  - tests/plugin/backend/flagos/test_multi_tensor.py::test_scale_non_finite_tracking
  - tests/plugin/backend/flagos/test_optimizer.py::test_multi_tensor_adam_lifecycle
  - tests/plugin/backend/flagos/test_optimizer.py::test_param_remainder_bit_manipulation_lifecycle
  # torch_gcu/topsaten: casting FP32 to float8_e4m3fn/float8_e5m2 is unsupported
