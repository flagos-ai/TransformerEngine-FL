# Enflame / GCU configuration for TransformerEngine-FL.
# Keep chip-specific setup out of common workflows.

hardware_name: enflame
display_name: 'Enflame GCU'
checkout_submodules: 'false'

ci_image: harbor.baai.ac.cn/flagos-dev/transformerengine-fl:manual-20260809-enflame-dev

runner_labels:
  - sy-8g-cicd-te

container_volumes: []

container_options: >-
  --privileged
  --ipc=host
  --shm-size=100g
  --ulimit memlock=-1
  --ulimit stack=67108864
  --user root
  --device=/dev/gcuctl
  --device=/dev/gcu0
  --device=/dev/gcu1
  --device=/dev/gcu2
  --device=/dev/gcu3
  --device=/dev/gcu4
  --device=/dev/gcu5
  --device=/dev/gcu6
  --device=/dev/gcu7

setup_script: .github/scripts/setup_enflame.sh

device_types:
  - S60

coverage:
  enabled: true
  required: false
  python: python3
  sources:
    - transformer_engine
  include:
    - transformer_engine/pytorch/*
    - transformer_engine/debug/*
    - transformer_engine/plugin/*
  omit:
    - '*/setup.py'
    - '*/transformer_engine/plugin/core/_build_config.py'

# Device budget per multi-device test job, not the host's total card count.
# Keep aligned with the devices exposed to the container and the test launcher.
nproc_per_node: 2

unit_test_matrix:
  - name: pytorch_debug
    runner: script
    path: tests/plugin/backend/enflame/run_unit_tests.sh
    args: [debug]
  - name: pytorch_unit
    runner: script
    path: tests/plugin/backend/enflame/run_unit_tests.sh
    args: [unittest]
  - name: pytorch_distributed
    runner: script
    path: tests/plugin/backend/enflame/run_unit_tests.sh
    args: [distributed]
  - name: pytorch_onnx
    runner: script
    path: tests/plugin/backend/enflame/run_unit_tests.sh
    args: [onnx]

integration_test_matrix:
  - name: pytorch_mcore_integration
    path: tests/plugin/backend/enflame/run_integration_tests.sh

# Exact paths or directory prefixes (ending in /) owned by this platform.
# Shared and unknown code paths conservatively trigger all platforms.
paths_watch:
  - .github/configs/enflame.yml
  - .github/scripts/setup_enflame.sh
  - tests/plugin/backend/enflame/
  - transformer_engine/plugin/core/backends/vendor/enflame/

# Missing test-group coverage is explicit; these entries do not claim hardware incapability.
unsupported_test_groups:
  normalization: Enflame unit QA has no normalization, sanity or numerics target; existing HF integration is not a dedicated normalization check.
  quantization: Enflame unit QA does not run recipe, quantized-tensor, FP8 or NVFP4 targets.
  vendor_backend: Enflame unit QA has no vendor or FlagOS backend target; reference GEMM coverage is recorded under gemm.
