# Enflame / GCU configuration for TransformerEngine-FL.
# Keep chip-specific setup out of common workflows.

hardware_name: enflame
display_name: 'Enflame GCU'
checkout_submodules: 'false'

# v2.17.0-enflame-ci-gems5.0.2-20261112; verified on two GCU devices.
ci_image: harbor.baai.ac.cn/flagos-dev/transformer-engine-fl:v2.17.0-enflame-ci-gems5.0.2-20261112

runner_labels:
  - sy-8g-cicd-te

container_volumes: []

container_options: >-
  --privileged
  --ipc=host
  --shm-size=100g
  --ulimit memlock=-1
  --ulimit stack=67108864
  --user root
  --device=/dev/gcuctl
  --device=/dev/gcu0
  --device=/dev/gcu1
  --device=/dev/gcu2
  --device=/dev/gcu3
  --device=/dev/gcu4
  --device=/dev/gcu5
  --device=/dev/gcu6
  --device=/dev/gcu7

setup_script: .github/scripts/setup_enflame.sh

device_types:
  - S60

coverage:
  enabled: true
  required: false
  python: python3
  sources:
    - transformer_engine
  include:
    - transformer_engine/pytorch/*
    - transformer_engine/debug/*
    - transformer_engine/plugin/*
  omit:
    - '*/setup.py'
    - '*/transformer_engine/plugin/core/_build_config.py'

# Device budget per multi-device test job, not the host's total card count.
# Keep aligned with the devices exposed to the container and the test launcher.
nproc_per_node: 2

unit_test_matrix:
  - name: pytorch_debug
    runner: script
    path: tests/plugin/backend/enflame/run_unit_tests.sh
    args: [debug]
  - name: pytorch_unit
    runner: script
    path: tests/plugin/backend/enflame/run_unit_tests.sh
    args: [unittest]
  - name: pytorch_distributed
    runner: script
    path: tests/plugin/backend/enflame/run_unit_tests.sh
    args: [distributed]
  - name: pytorch_onnx
    runner: script
    path: tests/plugin/backend/enflame/run_unit_tests.sh
    args: [onnx]

integration_test_matrix:
  - name: pytorch_mcore_integration
    path: tests/plugin/backend/enflame/run_integration_tests.sh

# Exact paths or directory prefixes (ending in /) owned by this platform.
# Shared and unknown code paths conservatively trigger all platforms.
paths_watch:
  - .github/configs/enflame.yml
  - .github/scripts/setup_enflame.sh
  - tests/plugin/backend/enflame/
  - transformer_engine/plugin/core/backends/vendor/enflame/

# Missing test-group coverage is explicit; these entries do not claim hardware incapability.
ignored_test_groups:
  quantization: Enflame unit QA does not run recipe, quantized-tensor, FP8 or NVFP4 targets.

# These tests will be skipped when running pytest (file or file::node).
# Only defects owned outside this repository belong here; give the reason,
# owner and restore condition in a comment above each group.
ignored_tests:
  # FlagTree Enflame backend (flagtree 0.7.0+enflame3.6): tt.atomic_rmw cannot be
  # legalized, so kernels using tl.atomic_add fail to compile (cross entropy),
  # hang while compiling (grouped dbias) or crash (mHC). Restore when atomics compile.
  - tests/plugin/plugin/triton_dispatch_numerics_cases.py::test_cross_entropy_forward_and_backward_match_native_exactly
  - tests/plugin/plugin/triton_dispatch_numerics_cases.py::test_grouped_dbias_functions_match_native_exactly
  - tests/plugin/plugin/triton_dispatch_numerics_cases.py::test_mhc_apis_match_native_exactly
  # FlagTree Enflame backend: unpermute_with_mask_map_bwd_with_merging_probs aborts
  # after the forward passes. Restore when the backward kernel runs.
  - tests/plugin/plugin/triton_dispatch_numerics_cases.py::test_real_permutation_forward_backward_matches_pytorch
  # FlagGems 5.0.2 Enflame backend (flag_gems/runtime/backend/_enflame/gcu300) in
  # v2.17.0-enflame-ci-gems5.0.2-20261112: these lifecycle tests drive FlagOS impls with
  # CPU tensors, which its mm rejects ("Expected a gcu device, but got: cpu") or the
  # FlagTree GCU launcher cannot address ("cannot be accessed from Kurama"), and its
  # mm/addmm shape checks reject generic_gemm_fl's 3-D cases ("incompatible dimensions").
  # Same seven selectors as Iluvatar's baseline; all passed with flag_gems 5.4.0 on
  # v2.17.0-enflame-ci. Restore when the Enflame FlagGems ops accept these inputs.
  - tests/plugin/backend/flagos/test_gemm.py::test_generic_gemm_lifecycle_matrix
  - tests/plugin/backend/flagos/test_gemm.py::test_grouped_gemm_standard_lifecycle
  - tests/plugin/backend/flagos/test_multi_tensor.py::test_l2_norm_non_finite_tracking
  - tests/plugin/backend/flagos/test_multi_tensor.py::test_scale_standard_lifecycle
  - tests/plugin/backend/flagos/test_multi_tensor.py::test_scale_non_finite_tracking
  - tests/plugin/backend/flagos/test_optimizer.py::test_multi_tensor_adam_lifecycle
  - tests/plugin/backend/flagos/test_optimizer.py::test_param_remainder_bit_manipulation_lifecycle
  # torch_gcu/topsaten: casting FP32 to float8_e4m3fn/float8_e5m2 is unsupported
  # (TOPSATEN_STATUS_NOT_SUPPORT) and aborts the process while the test builds its FP8
  # parameter, before the FlagOS FP8 Adam runs. Restore when torch_gcu supports float8 copies.
  - tests/plugin/backend/flagos/test_optimizer_extended.py::test_fp8_adam_updates_master_and_metadata
  # S60 GCU loader/runtime limitations; restore after the affected cases pass
  # on the vendor stack without exhausting the driver or rejecting FP8 copies.
  - tests/pytorch/test_fused_optimizer.py::TestFusedAdam::test_float
  - tests/pytorch/test_fused_optimizer.py::TestFusedAdam::test_half
  - tests/pytorch/test_fused_optimizer.py::TestAdamTest::test_grad_scaler_capturable
  - tests/pytorch/test_fused_optimizer.py::TestAdamTest::test_grad_scaler_capturable_master
  - tests/pytorch/test_fused_optimizer.py::TestFusedAdam::test_multi_params
  - tests/pytorch/test_hf_integration.py::test_save_and_load_hf_model
  - tests/pytorch/test_jit.py
  # Enflame distributed numerics/graph cases are currently unavailable in the
  # vendor runtime; restore after isolated multi-device runs pass.
  - tests/pytorch/distributed/test_numerics.py
  - tests/pytorch/distributed/test_numerics_exact.py
  - tests/pytorch/distributed/test_torch_fsdp2.py
  # The existing Enflame ONNX baseline excludes these export families until
  # the corresponding vendor kernels and graph conversions are supported.
  - tests/pytorch/test_onnx_export.py::test_export_linear*
  - tests/pytorch/test_onnx_export.py::test_export_layernorm_linear*
  - tests/pytorch/test_onnx_export.py::test_export_layernorm_mlp*
  - tests/pytorch/test_onnx_export.py::test_export_core_attention*
  - tests/pytorch/test_onnx_export.py::test_export_transformer_layer*
  - tests/pytorch/test_onnx_export.py::test_export_multihead_attention*
  - tests/pytorch/test_onnx_export.py::test_export_gpt_generation*
