# Missing test-group coverage is explicit; these entries do not claim hardware incapability.
ignored_test_groups:
  quantization: Current S5000 CI skips every selected FP8, MXFP8 and NVFP4 target; no passing quantization evidence is available.
  normalization: MUSA QA excludes normalization sanity/numerics and fusible normalization cases.
