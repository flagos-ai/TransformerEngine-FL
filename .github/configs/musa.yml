  - tests/pytorch/test_sanity.py::test_sanity_amp_and_nvfuser
  - tests/pytorch/test_sanity.py::test_sanity_drop_path
  - tests/pytorch/test_sanity.py::test_sanity_fused_qkv_params
  - tests/pytorch/test_sanity.py::test_sanity_gradient_accumulation_fusion
  - tests/pytorch/test_sanity.py::test_inference_mode
  - tests/pytorch/test_sanity.py::test_sanity_normalization_amp
  - tests/pytorch/test_sanity.py::test_sanity_layernorm_linear
  - tests/pytorch/test_sanity.py::test_sanity_linear_with_zero_tokens
  - tests/pytorch/test_sanity.py::test_sanity_grouped_linear
  - tests/pytorch/test_numerics.py::test_gpt_accuracy
  - tests/pytorch/test_numerics.py::test_mha_accuracy
  - tests/pytorch/test_numerics.py::test_dpa_accuracy
  - tests/pytorch/test_numerics.py::test_gpt_checkpointing
  - tests/pytorch/test_numerics.py::test_gpt_cuda_graph
  - tests/pytorch/test_numerics.py::test_noncontiguous
