# MooreThreads MUSA Hardware Configuration for TransformerEngine-FL

hardware_name: mthreads
display_name: 'MooreThreads MUSA Tests'
checkout_submodules: recursive

# Clean CI image rebuilt from f826afe-musa-dev via docker/musa/Dockerfile
ci_image: harbor.baai.ac.cn/flagos-dev/transformerengine-fl:20261127-musa-dev

# Runner labels for self-hosted MooreThreads node
# Adjust this label to match the actual GitHub Actions runner label.
runner_labels:
  - mt-8g-cicd-te

# Container volumes
container_volumes:
  - /dev/dri:/dev/dri
  - /home/flagscale_cicd/flask/static:/workspace/report

# Container options
container_options: >-
  --runtime=mthreads
  --ipc=host
  --privileged=true
  --shm-size=100gb
  --ulimit memlock=-1
  --ulimit stack=67108864
  --user root
  --group-add video
  -e PLATFORM=mthreads
  -e MTHREADS_VISIBLE_DEVICES=all
  -e MTHREADS_DRIVER_CAPABILITIES=all
  -e MUSA_HOME=/usr/local/musa
  -e PIP_NO_INDEX=1
  -e PIP_DISABLE_PIP_VERSION_CHECK=1

# Platform-specific environment setup script
setup_script: .github/scripts/setup_musa.sh

# Device types to run tests on
device_types:
  - s5000

coverage:
  enabled: true
  required: false
  python: python3
  sources:
    - transformer_engine
  include:
    - transformer_engine/pytorch/*
    - transformer_engine/debug/*
    - transformer_engine/plugin/*
  omit:
    - '*/setup.py'
    - '*/transformer_engine/plugin/core/_build_config.py'

# MUSA launchers keep platform-specific selection outside shared QA scripts.
# Device budget per multi-device test job, not the host's total card count.
# Keep aligned with the devices exposed to the container and the test launcher.
nproc_per_node: 8

unit_test_matrix:
  - name: pytorch_debug
    runner: script
    path: tests/plugin/backend/musa/run_unit_tests.sh
    args: [debug]
    timeout_minutes: 120
  - name: pytorch_unit
    runner: script
    path: tests/plugin/backend/musa/run_unit_tests.sh
    args: [unittest]
    timeout_minutes: 120
  - name: pytorch_distributed
    runner: script
    path: tests/plugin/backend/musa/run_unit_tests.sh
    args: [distributed]
    timeout_minutes: 120
  - name: pytorch_onnx
    runner: script
    path: tests/plugin/backend/musa/run_unit_tests.sh
    args: [onnx]
    timeout_minutes: 120

integration_test_matrix:
  - name: pytorch_mcore_integration
    path: tests/plugin/backend/musa/run_integration_tests.sh

# Exact paths or directory prefixes (ending in /) owned by this platform.
# Shared and unknown code paths conservatively trigger all platforms.
paths_watch:
  - .github/configs/musa.yml
  - .github/scripts/setup_musa.sh
  - tests/plugin/backend/musa/
  - transformer_engine/plugin/core/backends/vendor/musa/

# MUSA capability and numerical gaps are controlled centrally. The launcher
# always invokes these files; the selection plugin records the ignored nodes.
ignored_tests:
  # The compatibility guard previously skipped these files based on the host
  # torch.cuda state. Restore after the MUSA runtime/backend paths are usable.
  - tests/pytorch/test_cpu_offloading.py
  - tests/pytorch/test_cpu_offloading_v1.py
  - tests/pytorch/attention/test_attention.py
  - tests/pytorch/attention/test_kv_cache.py
  - tests/pytorch/test_hf_integration.py
  - tests/pytorch/test_checkpoint.py
  - tests/pytorch/test_jit.py
  - tests/pytorch/test_gqa.py
  # MUSA numerical/sanity gaps migrated from the previous negative selectors.
  - tests/pytorch/test_sanity.py::test_sanity_gpt
  - tests/pytorch/test_sanity.py::test_sanity_gpt_126m
  - tests/pytorch/test_sanity.py::test_sanity_bert
  - tests/pytorch/test_sanity.py::test_sanity_T5
  - tests/pytorch/test_sanity.py::test_sanity_layernorm_mlp
  - tests/pytorch/test_sanity.py::test_sanity_amp_and_nvfuser
  - tests/pytorch/test_sanity.py::test_sanity_drop_path
  - tests/pytorch/test_sanity.py::test_sanity_fused_qkv_params
  - tests/pytorch/test_sanity.py::test_sanity_gradient_accumulation_fusion
  - tests/pytorch/test_sanity.py::test_inference_mode
  - tests/pytorch/test_sanity.py::test_sanity_normalization_amp
  - tests/pytorch/test_sanity.py::test_sanity_layernorm_linear
  - tests/pytorch/test_sanity.py::test_sanity_linear_with_zero_tokens
  - tests/pytorch/test_sanity.py::test_sanity_grouped_linear
  - tests/pytorch/test_numerics.py::test_gpt_accuracy
  - tests/pytorch/test_numerics.py::test_mha_accuracy
  - tests/pytorch/test_numerics.py::test_dpa_accuracy
  - tests/pytorch/test_numerics.py::test_gpt_checkpointing
  - tests/pytorch/test_numerics.py::test_gpt_cuda_graph
  - tests/pytorch/test_numerics.py::test_noncontiguous
  - tests/pytorch/test_numerics.py::test_rmsnorm_accuracy
  - tests/pytorch/test_numerics.py::test_layernorm_accuracy
  - tests/pytorch/test_numerics.py::test_linear_accuracy
  - tests/pytorch/test_numerics.py::test_layernorm_linear_accuracy
  - tests/pytorch/test_numerics.py::test_layernorm_mlp_accuracy
  - tests/pytorch/test_numerics.py::test_transformer_layer_hidden_states_format
  - tests/pytorch/test_fused_optimizer.py::TestFusedAdam::test_bf16_exp_avg_and_exp_avg_sq
  - tests/pytorch/test_fusible_ops.py::TestBasicOps::test_layer_norm
  - tests/pytorch/test_fusible_ops.py::TestBasicOps::test_rmsnorm
  - tests/pytorch/test_fusible_ops.py::TestBasicOps::test_l2normalization
  - tests/pytorch/test_fusible_ops.py::TestSequentialModules::test_layernorm_mlp
  - tests/pytorch/test_fusible_ops.py::TestSequentialModules::test_grouped_mlp
  - tests/pytorch/test_fusible_ops.py::TestCustomOps
  - tests/pytorch/test_permutation.py::test_permutation_mask_map
  - tests/pytorch/test_permutation.py::test_permutation_and_padding_mask_map
  - tests/pytorch/test_permutation.py::test_permutation_and_padding_with_merging_probs
  - tests/pytorch/test_permutation.py::test_permutation_mask_map_alongside_probs
  - tests/pytorch/test_permutation.py::test_permutation_mask_map_topk1_no_probs
  - tests/pytorch/test_permutation.py::test_chunk_permutation
  # MUSA vendor scale kernel leaves the FP32 overflow inverse scale as the
  # smallest normal value instead of CUDA's zero. Restore when the extension
  # matches the TE scale/scale_inv overflow contract.
  - tests/plugin/accuracy/test_compute_scale.py::test_compute_scale_saturates_fp32_overflow
  # Verified passing on 20261127-musa-dev, but kept listed until
  # .github/scripts/ci/test_planner.py stops asserting their presence on MUSA.
  - tests/plugin/backend/flagos/test_gemm.py::test_generic_gemm_lifecycle_matrix
  - tests/plugin/backend/reference/test_dropout.py::test_dropout_fwd_zero_probability
  - tests/plugin/backend/reference/test_dropout.py::test_dropout_bwd_zero_probability
  # MUSA Triton autotuner reset_to_zero receives an empty launch-argument tuple
  # for the mHC kernel. Restore after the Triton MUSA backend fixes its launch
  # argument handling.
  - tests/plugin/plugin/triton_dispatch_numerics_cases.py::test_mhc_apis_match_native_exactly
  # MUSA vendor generic_gemm does not return bgrad for delayed wgrad. Restore
  # after transformer_engine_musa_torch exposes the upstream bgrad ABI.
  - tests/pytorch/test_numerics.py::test_linear_accuracy_delay_wgrad_compute
  # 20261127-musa-dev CI alignment: failures/hangs observed on MUSA S5000 without
  # legacy image sitecustomize monkey-patches.
  - jobs: [pytorch_debug]
    tests:
      # RuntimeError: All 1 implementation(s) failed for op='quantize'. Last error:
      # No module named 'transformer_engine.pytorch.tensor._internal'.
      # Owner: MUSA native runtime; restore when transformer_engine_musa_torch
      # matches current TE-FL quantizer tensor types.
      - tests/pytorch/debug/test_sanity.py::test_sanity_debug[fake_quant-False-mha_attention]
      - tests/pytorch/debug/test_sanity.py::test_sanity_debug[fake_quant-False-transformer_layer]
      - tests/pytorch/debug/test_api_features.py::test_per_tensor_scaling
      # Hangs (>5 min, ~99% CPU in pt_autograd_0) on zero-numel x[:0, :] tensor
      # with LogTensorStats and FlagGems generic_gemm; owner: MUSA/FlagGems runtime.
      # Restore when zero-numel forward/backward completes without deadlock.
      - tests/pytorch/debug/test_numerics.py::test_logging_zero_numel_tensor
  - jobs: [pytorch_unit]
    tests:
      # Without legacy image sitecustomize CUDA-device monkey-patches, upstream
      # NVIDIA tests that hardcode device="cuda", .cuda(), or torch.cuda RNG/init
      # fail on PyTorch built without CUDA. Keep the portable tests enabled
      # (tests/plugin/**, test_deferred_init::test_zero_memory_init,
      # test_fused_rope::test_rotary_position_embedding_forward_with_autocast_gives_same_result_as_without_autocast)
      # and restore these targets as upstream tests migrate to device-agnostic helpers.
      # Owner: upstream TE-FL test portability; restore per-file once CUDA hardcoding is removed.
      - tests/pytorch/test_sanity.py
      - tests/pytorch/test_deferred_init.py::TestDeferredInit::test_reset_parameters
      - tests/pytorch/test_deferred_init.py::TestDeferredInit::test_reset_parameters_doesnt_change_parameter_stats
      - tests/pytorch/test_numerics.py
      - tests/pytorch/test_fused_rope.py::test_fused_rope
      - tests/pytorch/test_fused_rope.py::test_fused_rope_thd
      - tests/pytorch/test_fused_rope.py::test_fused_qkv_rope
      - tests/pytorch/test_fused_rope.py::test_unfused_rope_thd_vs_bshd
      - tests/pytorch/test_fused_optimizer.py
      - tests/pytorch/test_multi_tensor.py
      - tests/pytorch/test_fusible_ops.py
      - tests/pytorch/test_permutation.py

# Missing test-group coverage is explicit; these entries do not claim hardware incapability.
ignored_test_groups:
  quantization: Current S5000 CI skips every selected FP8, MXFP8 and NVFP4 target; no passing quantization evidence is available.
  normalization: MUSA QA excludes normalization sanity/numerics and fusible normalization cases.
