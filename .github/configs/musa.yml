  - tests/pytorch/test_sanity.py::test_sanity_gpt
  - tests/pytorch/test_sanity.py::test_sanity_gpt_126m
  - tests/pytorch/test_sanity.py::test_sanity_bert
  - tests/pytorch/test_sanity.py::test_sanity_T5
