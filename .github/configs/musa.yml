# MooreThreads MUSA Hardware Configuration for TransformerEngine-FL

hardware_name: mthreads
display_name: 'MooreThreads MUSA Tests'
checkout_submodules: recursive

# CI image for MooreThreads MUSA dev env
ci_image: harbor.baai.ac.cn/flagos-dev/transformerengine-fl:f826afe-musa-dev

# Runner labels for self-hosted MooreThreads node
# Adjust this label to match the actual GitHub Actions runner label.
runner_labels:
  - mt-8g-cicd-te

# Container volumes
container_volumes:
  - /dev/dri:/dev/dri
  - /home/flagscale_cicd/flask/static:/workspace/report

# Container options
container_options: >-
  --runtime=mthreads
  --ipc=host
  --privileged=true
  --shm-size=100gb
  --ulimit memlock=-1
  --ulimit stack=67108864
  --user root
  --group-add video
  -e PLATFORM=mthreads
  -e MTHREADS_VISIBLE_DEVICES=all
  -e MTHREADS_DRIVER_CAPABILITIES=all
  -e MUSA_HOME=/usr/local/musa
  -e PIP_NO_INDEX=1
  -e PIP_DISABLE_PIP_VERSION_CHECK=1
  -e LD_LIBRARY_PATH=/usr/lib:/usr/lib/x86_64-linux-gnu:/usr/local/musa/lib:/usr/local/openmpi/lib:$LD_LIBRARY_PATH

# Platform-specific environment setup script
setup_script: .github/scripts/setup_musa.sh

# Device types to run tests on
device_types:
  - s5000

coverage:
  enabled: true
  required: false
  python: python3
  sources:
    - transformer_engine
  include:
    - transformer_engine/pytorch/*
    - transformer_engine/debug/*
    - transformer_engine/plugin/*
  omit:
    - '*/setup.py'
    - '*/transformer_engine/plugin/core/_build_config.py'

# MUSA launchers keep platform-specific selection outside shared QA scripts.
# Device budget per multi-device test job, not the host's total card count.
# Keep aligned with the devices exposed to the container and the test launcher.
nproc_per_node: 8

unit_test_matrix:
  - name: pytorch_debug
    runner: script
    path: tests/plugin/backend/musa/run_unit_tests.sh
    args: [debug]
    timeout_minutes: 120
  - name: pytorch_unit
    runner: script
    path: tests/plugin/backend/musa/run_unit_tests.sh
    args: [unittest]
    timeout_minutes: 120
  - name: pytorch_distributed
    runner: script
    path: tests/plugin/backend/musa/run_unit_tests.sh
    args: [distributed]
    timeout_minutes: 120
  - name: pytorch_onnx
    runner: script
    path: tests/plugin/backend/musa/run_unit_tests.sh
    args: [onnx]
    timeout_minutes: 120

integration_test_matrix:
  - name: pytorch_mcore_integration
    path: tests/plugin/backend/musa/run_integration_tests.sh

# Exact paths or directory prefixes (ending in /) owned by this platform.
# Shared and unknown code paths conservatively trigger all platforms.
paths_watch:
  - .github/configs/musa.yml
  - .github/scripts/setup_musa.sh
  - tests/plugin/backend/musa/
  - transformer_engine/plugin/core/backends/vendor/musa/

# MUSA capability and numerical gaps are controlled centrally. The launcher
# always invokes these files; the selection plugin records the ignored nodes.
ignored_tests:
  # The compatibility guard previously skipped these files based on the host
  # torch.cuda state. Restore after the MUSA runtime/backend paths are usable.
  - tests/pytorch/test_cpu_offloading.py
  - tests/pytorch/test_cpu_offloading_v1.py
