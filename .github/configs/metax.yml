# Metax Hardware Configuration for TE-FL
# This file defines CI/CD settings for Metax-based testing
# This file defines environment variables, volumes, and test filters for TE tests.

hardware_name: metax
display_name: 'Metax Tests'
checkout_submodules: recursive

# Built from the MACA 3.7.2.1 base using docker/metax/Dockerfile.
ci_image: harbor.baai.ac.cn/flagos-dev/transformer-engine-fl:v2.17.0-metax-ci

# Runner labels for self-hosted Metax node
# runner_labels:
#   - self-hosted
#   - Linux
#   - X64
#   - metax
#   - dev

# Runner labels for online env
runner_labels:
  - mx-8g-cicd-te

# Container volumes
container_volumes:
  - /nfs/metax_fs:/nfs/metax_fs

# Container options
# LD_LIBRARY_PATH comes from the image (MACA base: /opt/maca/lib:/opt/maca/mxgpu_llvm/lib).
# Do not pass -e LD_LIBRARY_PATH here: docker receives these options unexpanded,
# so a value here replaces the image's and torch then cannot load libmxomp.so.
container_options: >-
  --hostname=te_cicd
  --ipc=host
  --privileged=true
  --shm-size=100gb
  --ulimit memlock=-1
  --user root
  --ulimit nofile=65535:65535
  --group-add video
  -e PLATFORM=metax
  -e TORCH_DISTRIBUTED_BACKEND=mccl

# Platform-specific environment setup script
setup_script: .github/scripts/setup_metax.sh

# Device types to run tests on
device_types:
  - c550

coverage:
  enabled: true
  required: false
  python: /opt/te-ci/bin/python3
  sources:
    - transformer_engine
  include:
    - transformer_engine/pytorch/*
    - transformer_engine/debug/*
    - transformer_engine/plugin/*
  omit:
    - '*/setup.py'
    - '*/transformer_engine/plugin/core/_build_config.py'

# Device budget per multi-device test job, not the host's total card count.
# Keep aligned with the devices exposed to the container and the test launcher.
nproc_per_node: 4

unit_test_matrix:
  - name: pytorch_debug
    runner: script
    path: tests/plugin/backend/metax/run_unit_tests.sh
    args: [debug]
  - name: pytorch_unit
    runner: script
    path: tests/plugin/backend/metax/run_unit_tests.sh
    args: [unittest]
  - name: pytorch_distributed
    runner: script
    path: tests/plugin/backend/metax/run_unit_tests.sh
    args: [distributed]
  - name: pytorch_onnx
    runner: script
    path: tests/plugin/backend/metax/run_unit_tests.sh
    args: [onnx]

integration_test_matrix:
  - name: pytorch_mcore_integration
    path: tests/plugin/backend/metax/run_integration_tests.sh

# Test matrix configuration
test_matrix:
  unit:
    devices:
      - c550
    # Ignored test files for unit tests
    # These files will be skipped when running pytest
    ignored_tests:
      # example: tests/unit_tests/test_example.py
      # - tests/unit_tests/test_inference.py
      # - tests/unit_tests/test_rl_utils.py

# Exact paths or directory prefixes (ending in /) owned by this platform.
# Shared and unknown code paths conservatively trigger all platforms.
paths_watch:
  - .github/configs/metax.yml
  - .github/scripts/setup_metax.sh
  - docker/metax/
  - tests/plugin/backend/metax/
  - transformer_engine/plugin/core/backends/vendor/metax/

# Current QA coverage gaps, recorded in the plan instead of claimed as passing.
ignored_test_groups:
  attention: MetaX unit QA filters attention, RoPE, GQA, numerics and sanity attention targets; no matching attention testcase executes.
  quantization: Current C550 CI skips every selected FP8, MXFP8 and NVFP4 target; no passing quantization evidence is available.

# These tests will be skipped when running pytest (file or file::node).
# Only defects owned outside this repository belong here; give the reason,
# owner and restore condition in a comment above each group.
ignored_tests:
  # MetaX vendor tex.dropout_fwd (METAX_TE_WHEEL 2.13.0 on torch 2.8.0+metax3.7.2.0 in
  # v2.17.0-metax-ci): with the test suite's deterministic seed 1234, this (128, 128) FP32
  # p=0.5 sample draws 8017/16384 zeros (prob=0.4893, z=-2.734375 vs 99% CI limit 2.5758),
  # a fixed-seed RNG tail event while the other 35 training dropout cases pass. Restore when
  # the MetaX image/tex RNG stream or upstream test CI check no longer hits this tail.
  - tests/pytorch/test_fusible_ops.py::TestBasicOps::test_dropout[dtype0-shape2-None-True-0.5]
