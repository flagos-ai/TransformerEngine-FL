# Hygon DCU / DTK configuration for TransformerEngine-FL plugin QA.

hardware_name: hygon
display_name: 'Hygon DCU (DTK)'
checkout_submodules: 'false'

ci_image: harbor.baai.ac.cn/flagos-dev/transformer-engine-fl:v2.17.0-hygon-ci

runner_labels:
  - hg-8g-cicd-te

container_volumes:
  - /opt/hyhal:/opt/hyhal

container_options: >-
  --privileged
  --ipc=host
  --shm-size=100g
  --ulimit memlock=-1
  --ulimit stack=67108864
  --user root
  --device=/dev/kfd
  --device=/dev/dri
  --group-add video

setup_script: .github/scripts/setup_hygon.sh

coverage:
  enabled: true
  required: false
  python: python3
  sources:
    - transformer_engine
  include:
    - transformer_engine/pytorch/*
    - transformer_engine/debug/*
    - transformer_engine/plugin/*
  omit:
    - '*/setup.py'
    - '*/transformer_engine/plugin/core/_build_config.py'

# Device budget per multi-device test job, not the host's total card count.
# Keep aligned with the devices exposed to the container and the test launcher.
nproc_per_node: 8

unit_test_matrix:
  - name: pytorch_debug
    runner: script
    path: tests/plugin/backend/hygon/run_unit_tests.sh
    args: [debug]
  - name: pytorch_unit
    runner: script
    path: tests/plugin/backend/hygon/run_unit_tests.sh
    args: [unittest]
  - name: pytorch_distributed
    runner: script
    path: tests/plugin/backend/hygon/run_unit_tests.sh
    args: [distributed]
  - name: pytorch_onnx
    runner: script
    path: tests/plugin/backend/hygon/run_unit_tests.sh
    args: [onnx]

integration_test_matrix:
  - name: pytorch_mcore_integration
    path: tests/plugin/backend/hygon/run_integration_tests.sh

device_types:
  - bw1000

# Exact paths or directory prefixes (ending in /) owned by this platform.
# Shared and unknown code paths conservatively trigger all platforms.
paths_watch:
  - .github/configs/hygon.yml
  - .github/scripts/setup_hygon.sh
  - tests/plugin/backend/hygon/
  - transformer_engine/plugin/core/backends/vendor/hygon/

# Missing test-group coverage is explicit; these entries do not claim hardware incapability.
ignored_test_groups:
  debug: The current DTK reference backend lacks quantize and FP8 debug feature support; the full nvinspect debug suite is not adapted to Hygon.
  attention: Hygon unit QA does not run attention, RoPE, GQA or HF attention targets; CP utilities belong to the separate distributed group.
  quantization: Hygon unit QA has no recipe, quantized-tensor, FP8 or NVFP4 target.

# These tests will be skipped when running pytest (file or file::node).
# Only defects owned outside this repository belong here; give the reason,
# owner and restore condition in a comment above each group.
ignored_tests:
  # FlagTree/FlagTune: torch.compile's generated grid returns None because FlagTree
  # launches zero_pad_kernel with BLOCK_N=32, a config TE never declares.
  # Restore when compiled tracing passes.
  - tests/plugin/plugin/triton_dispatch_numerics_cases.py::test_dispatch_entry_does_not_shrink_the_compiled_graph
