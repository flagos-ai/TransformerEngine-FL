# Hygon DCU / DTK configuration for TransformerEngine-FL plugin QA.

hardware_name: hygon
display_name: 'Hygon DCU (DTK)'
checkout_submodules: 'false'

ci_image: harbor.baai.ac.cn/flagos-dev/transformer-engine-fl:v2.17.0-hygon-ci

runner_labels:
  - hg-8g-cicd-te

container_volumes:
  - /opt/hyhal:/opt/hyhal

container_options: >-
  --privileged
  --ipc=host
  --shm-size=100g
  --ulimit memlock=-1
  --ulimit stack=67108864
  --user root
  --device=/dev/kfd
  --device=/dev/dri
  --group-add video

setup_script: .github/scripts/setup_hygon.sh

coverage:
  enabled: true
  required: false
  python: python3
  sources:
    - transformer_engine
  include:
    - transformer_engine/pytorch/*
    - transformer_engine/debug/*
    - transformer_engine/plugin/*
  omit:
    - '*/setup.py'
    - '*/transformer_engine/plugin/core/_build_config.py'

# Device budget per multi-device test job, not the host's total card count.
# Keep aligned with the devices exposed to the container and the test launcher.
nproc_per_node: 8

unit_test_matrix:
  - name: pytorch_debug
    runner: script
    path: tests/plugin/backend/hygon/run_unit_tests.sh
    args: [debug]
  - name: pytorch_unit
    runner: script
    path: tests/plugin/backend/hygon/run_unit_tests.sh
    args: [unittest]
  - name: pytorch_distributed
    runner: script
    path: tests/plugin/backend/hygon/run_unit_tests.sh
    args: [distributed]
  - name: pytorch_onnx
    runner: script
    path: tests/plugin/backend/hygon/run_unit_tests.sh
    args: [onnx]

integration_test_matrix:
  - name: pytorch_mcore_integration
    path: tests/plugin/backend/hygon/run_integration_tests.sh

device_types:
  - bw1000

# Exact paths or directory prefixes (ending in /) owned by this platform.
# Shared and unknown code paths conservatively trigger all platforms.
paths_watch:
  - .github/configs/hygon.yml
  - .github/scripts/setup_hygon.sh
  - tests/plugin/backend/hygon/
  - transformer_engine/plugin/core/backends/vendor/hygon/

# Missing test-group coverage is explicit; these entries do not claim hardware incapability.
ignored_test_groups:
  attention: Hygon unit QA does not run attention, RoPE, GQA or HF attention targets; CP utilities belong to the separate distributed group.
  quantization: Hygon unit QA has no recipe, quantized-tensor, FP8 or NVFP4 target.

# These tests will be skipped when running pytest (file or file::node).
# Only defects owned outside this repository belong here; give the reason,
# owner and restore condition in a comment above each group.
ignored_tests:
  # Hygon DCU launch limit: num_warps=32 exceeds the device thread limit.
  - tests/plugin/plugin/triton_dispatch_numerics_cases.py::test_cross_entropy_forward_and_backward_match_native_exactly
  # FlagTree/FlagTune: compiled graph tracing currently produces an invalid grid.
  - tests/plugin/plugin/triton_dispatch_numerics_cases.py::test_dispatch_entry_does_not_shrink_the_compiled_graph
  # The shared FP8 block-scaling capability check converts torch.version.cuda
  # unconditionally; Hygon's non-CUDA DTK build exposes None during collection.
  # Restore after the shared check handles non-CUDA runtimes.
  - tests/pytorch/debug/test_log.py
  - tests/pytorch/test_sanity.py
  # Hygon's current TE-FL registry has no quantize operator for these debug
  # quantization paths. Restore after the Hygon backend exposes quantize.
  - tests/pytorch/debug/test_api_features.py::test_statistics_collection
  - tests/pytorch/debug/test_api_features.py::test_statistics_multi_run
  # Hygon DTK launch/runtime limitations; restore after the affected paths pass.
  - tests/pytorch/test_jit.py::test_torch_dynamo
  - tests/pytorch/test_onnx_export.py::test_export_linear*
  - tests/pytorch/test_onnx_export.py::test_export_layernorm_linear*
  - tests/pytorch/test_onnx_export.py::test_export_layernorm_mlp*
  - tests/pytorch/test_onnx_export.py::test_export_core_attention*
  - tests/pytorch/test_onnx_export.py::test_export_transformer_layer*
  - tests/pytorch/test_onnx_export.py::test_export_multihead_attention*
  - tests/pytorch/test_onnx_export.py::test_export_gpt_generation*
