# KunlunXin Hardware Configuration for TransformerEngine-FL.
# The CI image points at the Harbor tag validated for KunlunXin QA.

hardware_name: kunlunxin
display_name: 'KunlunXin XPU'
checkout_submodules: recursive

ci_image: harbor.baai.ac.cn/flagos-dev/transformerengine-fl:b98d43b-kunlun-dev

# Runner labels for the self-hosted KunlunXin node.
runner_labels:
  - kl-8g-cicd-te

container_volumes: []

container_options: >-
  --privileged
  --ipc=host
  --shm-size=100g
  --ulimit memlock=-1
  --ulimit stack=67108864
  --ulimit nofile=65535:65535
  --user root
  --group-add video
  --device=/dev/xpu0
  --device=/dev/xpu1
  --device=/dev/xpu2
  --device=/dev/xpu3
  --device=/dev/xpu4
  --device=/dev/xpu5
  --device=/dev/xpu6
  --device=/dev/xpu7
  --device=/dev/xpuctrl
  --device=/dev/knem

setup_script: .github/scripts/setup_kunlun.sh

device_types:
  - kunlunxin

coverage:
  enabled: true
  required: false
  python: python3
  sources:
    - transformer_engine
  include:
    - transformer_engine/pytorch/*
    - transformer_engine/debug/*
    - transformer_engine/plugin/*
  omit:
    - '*/setup.py'
    - '*/transformer_engine/plugin/core/_build_config.py'

# Device budget per multi-device test job, not the host's total card count.
# Keep aligned with the devices exposed to the container and the test launcher.
nproc_per_node: 8

unit_test_matrix:
  - name: pytorch_debug
    runner: script
    path: tests/plugin/backend/kunlun/run_unit_tests.sh
    args: [debug]
  - name: pytorch_unit
    runner: script
    path: tests/plugin/backend/kunlun/run_unit_tests.sh
    args: [unittest]
  - name: pytorch_distributed
    runner: script
    path: tests/plugin/backend/kunlun/run_unit_tests.sh
    args: [distributed]
  - name: pytorch_onnx
    runner: script
    path: tests/plugin/backend/kunlun/run_unit_tests.sh
    args: [onnx]

integration_test_matrix:
  - name: pytorch_mcore_integration
    path: tests/plugin/backend/kunlun/run_integration_tests.sh

# Exact paths or directory prefixes (ending in /) owned by this platform.
# Shared and unknown code paths conservatively trigger all platforms.
paths_watch:
  - .github/configs/kunlun.yml
  - .github/scripts/setup_kunlun.sh
  - tests/plugin/backend/kunlun/
  - transformer_engine/plugin/core/backends/vendor/kunlunxin/

# KunlunXin runtime gaps migrated from the old negative pytest selectors.
ignored_tests:
  # KunlunXin vendor extension/runtime reports different scale and overflow
  # semantics from the CUDA reference (including unsupported/altered frexp
  # behavior). Restore when vendor.kunlunxin matches the TE scale contract.
  - tests/plugin/accuracy/test_compute_scale.py
  # FlagOS fused RoPE produces numerical mismatches across SBHD, BSHD, THD and
  # QKV layouts on the current KunlunXin Triton runtime. Restore after the
  # default.flagos kernel matches the reference in every layout.
  - tests/plugin/backend/flagos/test_fused_rope.py
  # The isolated Triton numerics child process still fails on KunlunXin, but
  # the current wrapper does not preserve the failing child case in CI logs.
  - tests/plugin/plugin/test_triton_dispatch_numerics.py::test_numerics_cases_pass_in_a_clean_process
  # FakeQuant debug configuration is unavailable on the current XPU runtime.
  - tests/pytorch/debug/test_sanity.py::test_sanity_debug[fake_quant-False-linear]
  - tests/pytorch/debug/test_sanity.py::test_sanity_debug[fake_quant-False-layernorm_linear]
  - tests/pytorch/debug/test_sanity.py::test_sanity_debug[fake_quant-False-layernorm_mlp]
  - tests/pytorch/debug/test_sanity.py::test_sanity_debug[fake_quant-False-mha_attention]
  - tests/pytorch/debug/test_sanity.py::test_sanity_debug[fake_quant-False-transformer_layer]
  - tests/pytorch/debug/test_sanity.py::test_sanity_debug[fake_quant-True-linear]
  - tests/pytorch/debug/test_sanity.py::test_sanity_debug[fake_quant-True-layernorm_linear]
  - tests/pytorch/debug/test_sanity.py::test_sanity_debug[fake_quant-True-layernorm_mlp]
  - tests/pytorch/debug/test_sanity.py::test_sanity_debug[fake_quant-True-mha_attention]
  - tests/pytorch/debug/test_sanity.py::test_sanity_debug[fake_quant-True-transformer_layer]
  - tests/pytorch/debug/test_api_features.py::test_per_tensor_scaling
  - tests/pytorch/debug/test_api_features.py::test_fake_quant
  - tests/pytorch/debug/test_api_features.py::test_statistics_collection
  - tests/pytorch/debug/test_api_features.py::test_statistics_multi_run
  - tests/pytorch/distributed/test_torch_fsdp2.py::test_fsdp2_mem_leak_tests

# Missing test-group coverage is explicit; these entries do not claim hardware incapability.
ignored_test_groups:
  distributed: Current KunlunXin XCCL/KCCL runtime times out on ALLGATHER in the distributed numerics and cast-master tests; restore after the KunlunXin image communication stack passes these multi-process tests.
  quantization: Current Kunlun QA runs recipe targets only and all are skipped by capability checks; no passing quantization evidence is available.
  optimizer: Kunlun unit QA does not run fused optimizer, multi-tensor or backend optimizer targets.
  attention: Kunlun unit QA selects normalization/linear sanity cases only; attention targets are not wired.
