# Huawei Ascend NPU configuration for TransformerEngine-FL
# This file follows the same schema as cuda.yml and metax.yml.

hardware_name: ascend
display_name: 'Huawei Ascend NPU'
checkout_submodules: recursive

# CI image for the Ascend environment
ci_image: harbor.baai.ac.cn/flagos-dev/transformer-engine-fl:v2.17.0-ascend-ci

# Runner labels for the self-hosted Ascend node
runner_labels:
  - flagcicd-910c

# Container volumes
container_volumes:
  - /usr/local/Ascend/driver:/usr/local/Ascend/driver
  - /usr/local/Ascend/add-ons:/usr/local/Ascend/add-ons

# Container options
container_options: >-
  --privileged
  --shm-size=100g
  --ipc=host
  --ulimit memlock=-1
  --ulimit stack=67108864
  --user root
  --device=/dev/davinci0
  --device=/dev/davinci1
  --device=/dev/davinci2
  --device=/dev/davinci3
  --device=/dev/davinci_manager
  --device=/dev/devmm_svm
  --device=/dev/hisi_hdc

# Platform-specific environment setup script
setup_script: .github/scripts/setup_ascend.sh

coverage:
  enabled: true
  required: true
  python: python3
  sources:
    - transformer_engine
  include:
    - transformer_engine/pytorch/*
    - transformer_engine/debug/*
    - transformer_engine/plugin/*
  omit:
    - '*/setup.py'
    - '*/transformer_engine/plugin/core/_build_config.py'

# Device budget per multi-device test job, not the host's total card count.
# Keep aligned with the devices exposed to the container and the test launcher.
nproc_per_node: 4

unit_test_matrix:
  - name: pytorch_debug
    runner: script
    path: tests/plugin/backend/ascend/run_unit_tests.sh
    args: [debug]
  - name: pytorch_unit
    runner: script
    path: tests/plugin/backend/ascend/run_unit_tests.sh
    args: [unittest]
  - name: pytorch_distributed
    runner: script
    path: tests/plugin/backend/ascend/run_unit_tests.sh
    args: [distributed]
  - name: pytorch_onnx
    runner: script
    path: tests/plugin/backend/ascend/run_unit_tests.sh
    args: [onnx]

integration_test_matrix:
  - name: pytorch_mcore_integration
    path: tests/plugin/backend/ascend/run_integration_tests.sh

# Device types to run tests on
device_types:
  - ascend

# Exact paths or directory prefixes (ending in /) owned by this platform.
# Shared and unknown code paths conservatively trigger all platforms.
paths_watch:
  - .github/configs/ascend.yml
  - .github/scripts/setup_ascend.sh
  - tests/plugin/backend/ascend/
  - transformer_engine/plugin/core/backends/vendor/npu/
  - tests/plugin/backend/npu/

# Record test groups with no passing Ascend coverage.
ignored_test_groups:
  router: >-
    All 933 executed Router cases failed on Ascend because the current CI
    runtime has no registered fused TopK or aux-loss operators. Restore after
    these operators are available and a targeted Router rerun passes.
  mhc: >-
    All 195 mHC cases failed on Ascend in PR #211 because Triton detected
    both NPUDriver and CudaDriver as active. Restore after the CI image
    selects the Ascend driver and a targeted mHC rerun produces passing
    JUnit evidence.

# These tests will be skipped when running pytest (file or file::node).
# Only defects owned outside this repository belong here; give the reason,
# owner and restore condition in a comment above each group.
ignored_tests:
  # torch_npu/CANN: casting FP32 to float8_e4m3fn/float8_e5m2 on the 910 fails in
  # aclnnInplaceCopy (error 561103) while the test builds its FP8 parameter, before
  # the FlagOS FP8 Adam runs. Restore when torch_npu supports float8 copies.
  - tests/plugin/backend/flagos/test_optimizer_extended.py::test_fp8_adam_updates_master_and_metadata
  # torch_npu/CANN: vendor.npu multi-tensor scale uses different overflow and
  # frexp/double fallback semantics from the CUDA reference. Restore when the
  # NPU extension reports the same scale/scale_inv contract.
  - tests/plugin/accuracy/test_compute_scale.py
  # torch_npu/CANN: this exact NPU layernorm parity case differs by one ULP under
  # strict equality; the other NPU layernorm cases remain enabled. Restore when
  # the vendor kernel reaches the reference tolerance.
  - tests/plugin/backend/npu/test_layernorm.py::TestLayerNormTENPUParity::test_dense_forward_backward_matrix
  # Ascend pytorch_unit failures from PR #211, job 138975806148 (2026-11-25).
  # Use function selectors when cases only failed or capability-skipped, and
  # parameter selectors when the function also had passing cases.
