# Changed files raise the requested test level. Each file takes the highest
# minimum_level among matching rules, or unknown_level when none match.
# The plan takes the maximum over all files.
# Documentation (docs/, *.md, *.rst) neither escalates nor selects platforms.
test_level_rules:
  version: v2
  unknown_level: L2
  rules:
    - id: ci-and-build
      paths:
        - .github/**
        - .flagcicd/**
        - CMakeLists.txt
        - cmake/**
        - setup.py
        - pyproject.toml
      minimum_level: L2
    - id: native-extension
      paths:
        - transformer_engine/**/csrc/**
        - transformer_engine/**/cpp/**
        - transformer_engine/**/cuda/**
      minimum_level: L3
    - id: mcore-integration
      paths:
        - qa/L1_pytorch_mcore_integration/**
        - tests/plugin/backend/*/run_integration_tests.sh
      minimum_level: L2
    - id: distributed-and-onnx
      paths:
        - transformer_engine/pytorch/distributed.py
        - transformer_engine/pytorch/ep.py
        - transformer_engine/pytorch/newton_schulz.py
        - transformer_engine/pytorch/attention/dot_product_attention/context_parallel.py
        - transformer_engine/pytorch/export.py
        - transformer_engine/pytorch/onnx_extensions.py
        - tests/pytorch/distributed/**
        - tests/pytorch/attention/test_cp_utils.py
        - tests/plugin/backend/reference/test_context_parallel.py
        - qa/L1_pytorch_distributed_unittest/**
        - tests/pytorch/test_onnx_export.py
        - qa/L1_pytorch_onnx_unittest/**
        - tests/plugin/backend/*/run_unit_tests.sh
        - tests/plugin/backend/*/config.sh
        - tests/plugin/backend/*/set_env.sh
      minimum_level: L2
    - id: shared-pytorch-source
      paths:
        - transformer_engine/**
      minimum_level: L2
    - id: numerical-and-performance
      paths:
        - tests/pytorch/**
        - tests/plugin/**
        - qa/**
      minimum_level: L1

coverage:
  language: python
  tool: coverage.py
  source_roots:
    - transformer_engine
  metric_types:
    - line
    - branch
  preserve_raw_fragments: true
  report_schema: flagcicd.report/v1
  # PR: advisory absolute threshold against main. Nightly: advisory 3-sigma
  # window over earlier nightly reports per platform/device/level.
  regression_contract: .flagcicd/golden_baseline.json

report:
  group_schema: flagcicd.group-report/v1
  platform_schema: flagcicd.platform-report/v1
  gate_schema: flagcicd.gate/v1
  coverage_schema: flagcicd.report/v1
  statuses:
    - passed
    - test_failed
    - build_failed
    - infra_error
    - unsupported
    - skipped
    - cancelled
    - report_error

# Fixed gate contract (implemented by planner, identity verifier and workflows):
# plan/source/config identities and required group evidence are mandatory.
# Optional groups may fail or omit reports; supplied reports must match the plan.
# coverage.required in each platform config controls collection failures.
# PR/nightly coverage regression checks are advisory.
