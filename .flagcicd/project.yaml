schema_version: flagcicd.project/v1
repository: TransformerEngine-FL

# Repository-facing CI contract. Platform files under .github/configs remain
# the source of truth for images, runners, setup scripts, and per-platform test
# entries; this file owns stages, levels, resources, and the test-group catalog.
# .github/scripts/ci/flagcicd_planner.py turns both into a flagcicd.plan/v1.
platform_config_glob: .github/configs/*.yml
plan_schema: flagcicd.plan/v1

# Stage semantics. "affected" narrows platforms and groups from the PR diff;
# "all" runs every platform; "requested" runs the platforms named by the caller.
# fixed_level stages ignore requested levels and path-based level inference.
stages:
  pr:
    entry_workflow: .github/workflows/ci.yml (pull_request)
    selection: affected
    default_level: L1
  branch:
    entry_workflow: .github/workflows/ci.yml (push, workflow_dispatch)
    selection: all
    default_level: L2
  nightly:
    entry_workflow: .github/workflows/nightly.yml (schedule, workflow_dispatch)
    selection: all
    default_level: L2
    fixed_level: true
  manual:
    # Requested runs keep the previous unit + integration default; callers
    # may request any level, and changed_files (if given) can only raise it.
    entry_workflow: .github/workflows/ci-requested.yml (/ci comment, workflow_dispatch)
    selection: requested
    default_level: L2
  release:
    entry_workflow: .github/workflows/release-acceptance.yml (workflow_dispatch)
    selection: all
    default_level: L4
    fixed_level: true

# Levels are cumulative eligibility ceilings. Full plans select all configured
# groups up to N; affected PR plans narrow modules and add their dependencies.
# Group timeouts live in test_groups[*].resources.
levels:
  L0:
    required_groups: [preflight]
    purpose: checkout, config, image, device, wheel, dependencies, preflight
  L1:
    purpose: debug, unit operators, dispatch, numerical smoke
    required_groups: [core]
    note: Debug and portable unit modules provide the baseline; levels do not imply device count.
  L2:
    purpose: L1 + integration, distributed, ONNX, MCore
  L3:
    purpose: L2 + FA versions, benchmark, performance and coverage regression
    note: >-
      fa_versions is blocked until an sm90+ runner exists; pytorch_benchmark is
      blocked until a performance baseline exists. Nightly coverage regression
      is statistical (see golden_baseline.json) and advisory.
  L4:
    purpose: L3 + cross-repo, model, release wheel, backward compatibility, golden baseline
    note: >-
      Release acceptance only (release-acceptance.yml). Every L4 group is
      blocked with a reason, so a release plan cannot report ready until each
      contract is implemented.

# Scheduling contract. Groups with exclusive: true or devices > 1 run in the
# serial lane (max-parallel 1, after the parallel lane) so they never share a
# platform runner pool with another group of the same run. Exclusive classes
# cannot be relaxed by a group. devices: nproc_per_node reads the required
# per-platform device budget; different platforms need not use the same count.
resource_classes:
  shared_cpu:
    devices: 0
    exclusive: false
  single_device:
    devices: 1
    exclusive: false
  multi_device:
    devices: nproc_per_node
    exclusive: false
  communication_exclusive:
    devices: nproc_per_node
    exclusive: true
  model_exclusive:
    devices: nproc_per_node
    exclusive: true
  hopper_only:
    devices: nproc_per_node
    exclusive: true
  release_exclusive:
    devices: nproc_per_node
    exclusive: true

# One functional test-group catalog. depends_on expands test selection; it does
# not impose job execution order. execution selects a platform matrix entry.
# Groups sharing that entry run once, with their selected test files combined.
# Shared/impact paths and unavailable ownership keep the full in-level scope.
routing:
  shared_paths:
  - .github/**
  - .flagcicd/**
  - tests/test_utils/**
  - tests/pytorch/utils.py
  - tests/plugin/utils.py
  - tests/plugin/backend/*/config.sh
  - tests/plugin/backend/*/set_env.sh
  - tests/plugin/backend/*/run_unit_tests.sh
  - tests/plugin/backend/*/run_integration_tests.sh
  impact_paths:
  - transformer_engine/__init__.py
  - transformer_engine/pytorch/__init__.py
  - transformer_engine/pytorch/constants.py
  - transformer_engine/pytorch/utils.py
  - transformer_engine/pytorch/module/base.py
  - transformer_engine/pytorch/module/_common.py
  - transformer_engine/pytorch/ops/_common.py
  - transformer_engine/pytorch/quantization.py
  - transformer_engine/pytorch/fp8.py
  - transformer_engine/plugin/core/manager.py
  - transformer_engine/plugin/core/registry.py
  - transformer_engine/plugin/core/ops.py
  - transformer_engine/plugin/core/types.py
  - transformer_engine/plugin/core/policy.py

# Each group owns its level, paths, dependencies, execution mapping and evidence.
# test_targets accepts paths/globs and path::class/function selectors; mixed
# files use node selectors so an unrelated passing test cannot certify a group.
# Platform files only provide concrete launchers, environment and coverage gaps.
# blocked groups stay in the plan ledger and are never reported as executed.
test_groups:
  - name: preflight
    kind: preflight
    level: L0
    required: true
    evidence: exit_code
    resources:
      class: shared_cpu
      timeout_minutes: 90
    description: Repository structure and Python syntax preflight.
    paths: []
    depends_on: []
  - name: core
    description: Portable initialization, graph/JIT and checkpoint smoke tests.
    level: L1
    depends_on: []
    paths:
    - transformer_engine/pytorch/cpu_offload*.py
    - transformer_engine/pytorch/graph.py
    - transformer_engine/pytorch/jit.py
    - transformer_engine/pytorch/torch_version.py
    - tests/pytorch/test_deferred_init.py
    - tests/pytorch/test_sanity_import.py
    - tests/pytorch/test_jit.py
    - tests/pytorch/test_cuda_graphs.py
    - tests/pytorch/test_checkpoint.py
    - tests/pytorch/test_cpu_offloading*.py
    test_targets:
    - tests/pytorch/test_deferred_init.py
    - tests/pytorch/test_sanity_import.py
    - tests/pytorch/test_jit.py
    - tests/pytorch/test_cuda_graphs.py
    - tests/pytorch/test_checkpoint.py
    - tests/pytorch/test_cpu_offloading*.py
    - tests/plugin/plugin/test_manager.py
    kind: unit
    required: true
    evidence: junit
    coverage: true
    resources:
      class: multi_device
      timeout_minutes: 90
    execution:
      matrix: unit_test_matrix
      entry: pytorch_unit
  - name: plugin_core
    description: Complete plugin core, backend contracts and cross-backend accuracy tests.
    level: L1
    depends_on:
    - core
    paths:
    - transformer_engine/plugin/core/*.py
    - transformer_engine/plugin/core/triton_dispatch/
    - transformer_engine/plugin/core/backends/
    - transformer_engine/pytorch/triton/
    - transformer_engine/plugin/*.py
    - tests/plugin/
    test_targets:
    - tests/plugin/
    kind: unit
    required: true
    evidence: junit
    coverage: true
    resources:
      class: multi_device
      timeout_minutes: 90
    execution:
      matrix: unit_test_matrix
      entry: pytorch_unit
  - name: reference_backend
    description: Reference backend lifecycle and operator tests.
    level: L1
